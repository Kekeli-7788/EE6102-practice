><ul style=\"margin:6px 0;padding-left:20px\"><li><b>Presentation attack</b>：用伪造物冒充（假指纹）。</li><li><b>Sensor output interception</b>：截获模板再重放。</li><li><b>数据库漏洞</b>：参考模板被盗。</li><li><b>Enrollment 完整性</b>：攻击者用自己的扫描为合法用户注册。</li><li><b>内部人员</b>。</li><li>结论：生物识别<b>不是完全安全</b>，宜与密码<b>结合</b>使用，而不是取代。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>Biometrics vs Passwords（P3-52）</h3><table><tr><th></th><th>Passwords</th><th>Biometrics</th></tr><tr><td>安全性</td><td>中（可被猜）</td><td>高（难偷）</td></tr><tr><td>便利性</td><td>低（易忘）</td><td>高</td></tr><tr><td>可撤销</td><td>是</td><td>否</td></tr><tr><td>欺骗风险</td><td>泄露后容易</td><td>需费力</td></tr><tr><td>成本</td><td>低</td><td>高</td></tr></table></div><div class=\"card\" style=\"margin-top:12px\"><h3>易错点</h3><ul style=\"margin:6px 0;padding-left:20px\"><li>FRR = Type I，FAR = Type II，别颠倒。</li><li>灵敏度越高，<b>FAR 越低</b>，FRR 越高。</li><li><b>Identification 是 1:N，Verification 是 1:1</b>。</li><li>虹膜最准确，视网膜虽很安全但不主流；指纹最常用。</li><li>Bottom-up “很少奏效”，Top-down 有高层支持和经费。</li></ul></div>", "4": "<div class=\"card\" style=\"margin-top:0px\"><h3>基本概念（P4-4 ~ P4-16）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li><b>Plaintext</b> 明文、<b>Ciphertext</b> 密文、<b>Cipher</b> 算法、<b>Key</b> 密钥。记号：<b>E(M) = C</b>，<b>D(C) = M</b>。</li><li>三大类：<b>Symmetric</b>（一把钥匙）、<b>Asymmetric</b>（两把钥匙）、<b>Hashing</b>（无钥匙）。</li><li><b>安全 = 算法强度 + 密钥长度</b>；密钥每加 1 位，组合数翻倍。</li><li>密钥长度例（每秒 100 万次）：56 位 ≈ <b>2285 年</b>；64 位 ≈ 585,000 年；128 位 ≈ 10<sup>25</sup> 年。实际上有僵尸网络并行，比理论更容易被破。</li><li><b>Bit stream 流密码</b>（逐位，如 RC4）vs <b>Block cipher 分组密码</b>（分块，如 DES、AES）。模式：<b>ECB</b>（每块独立）、<b>CBC</b>（下一块依赖前一块输出）。</li><li>密码学提供：机密性、完整性、认证、<b>不可否认性</b>（后两项靠数字签名）。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>对称加密 DES / AES（P4-18 ~ P4-42）</h3><table><tr><th></th><th>DES</th><th>AES</th></tr><tr><td>块大小</td><td>64 位</td><td><b>128 位</b></td></tr><tr><td>密钥</td><td>56 位（有效）</td><td>128 / 192 / 256 位</td></tr><tr><td>轮数</td><td>16 轮</td><td>10 / 12 / 14 轮</td></tr><tr><td>年代</td><td>1976–77（IBM 的 Lucifer 改造）</td><td>2000 选出，NIST 2001 标准化（Rijndael）</td></tr><tr><td>安全性</td><td>已不安全；1998 年 EFF 机器 56 小时破解</td><td>目前安全；无已知实际攻击</td></tr><tr><td>可能密钥数</td><td>2<sup>56</sup></td><td>2<sup>128</sup> / 2<sup>192</sup> / 2<sup>256</sup></td></tr><tr><td>结构</td><td>初始/最终置换 + 16 轮（替换 + 置换）</td><td>Substitution、ShiftRow、MixColumn、KeyAdd</td></tr></table></div><div class=\"card\" style=\"margin-top:12px\"><h3>DES 的后续</h3><ul style=\"margin:6px 0;padding-left:20px\"><li><b>Double DES</b>：两个密钥 112 位，但<b>中间相遇攻击（meet-in-the-middle）</b>使其不比 DES 强多少。</li><li><b>3DES</b>：DES 三次，比 DES 慢 3 倍，更安全；是 AES 之前的过渡方案。</li><li><b>DES 争议</b>：密钥由 128 缩短到 56；S 盒设计保密，被怀疑有 NSA 后门。</li><li><b>对称加密优点</b>：快、简单、广泛使用（SSL/TLS、磁盘加密）。<b>缺点</b>：<b>密钥分发</b>困难；用户多时密钥数<b>不可扩展</b>。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>公钥加密（P4-44 ~ P4-49）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li>两把相关的钥匙：<b>public key</b>（可公开，用于加密和验证签名）、<b>private key</b>（保密，用于解密和签名）。<b>无法从公钥推出私钥</b>。</li><li><b>公钥加密</b>：用<b>对方的公钥</b>加密 → 只有对方的私钥能解 → <b>机密性</b>。</li><li><b>公钥认证（签名）</b>：用<b>自己的私钥</b>加密/签名 → 任何人用你的公钥验证 → <b>认证 + 不可否认</b>。</li><li>算法：<b>Diffie-Hellman、ElGamal、RSA、ECC</b>。DH 由 Diffie 和 Hellman 于 1976 年发明。核心问题：证明公钥属于谁 → <b>PKI 和 CA</b>。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>必会：Diffie-Hellman（P4-51 ~ P4-65）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li><b>DH 只做密钥交换，不加密也不解密消息。</b>安全性基于<b>离散对数问题</b>：已知 g、x、p 容易算 y = g<sup>x</sup> mod p；已知 y、g、p 很难求 x。</li></ul>\n<table><tr><th>步骤</th><th>内容</th></tr>\n<tr><td>1 公开</td><td>素数 <b>q (p)</b> 和本原根/生成元 <b>a (g)</b></td></tr>\n<tr><td>2 A</td><td>选私钥 X<sub>A</sub>；公钥 <b>Y<sub>A</sub> = a<sup>X<sub>A</sub></sup> mod q</b></td></tr>\n<tr><td>3 B</td><td>选私钥 X<sub>B</sub>；公钥 <b>Y<sub>B</sub> = a<sup>X<sub>B</sub></sup> mod q</b></td></tr>\n<tr><td>4 交换</td><td>互相发送公钥（窃听者能看到 Y<sub>A</sub>、Y<sub>B</sub>）</td></tr>\n<tr><td>5 A</td><td><b>K = Y<sub>B</sub><sup>X<sub>A</sub></sup> mod q</b></td></tr>\n<tr><td>6 B</td><td><b>K = Y<sub>A</sub><sup>X<sub>B</sub></sup> mod q</b>（与 A 算出的相同）</td></tr></table>\n<p><b>例（2024 年期末）</b>：p=7，g=5，a=7，b=4。A = 5<sup>7</sup> mod 7 = <b>5</b>；B = 5<sup>4</sup> mod 7 = <b>2</b>；K = B<sup>a</sup> = 2<sup>7</sup> mod 7 = <b>2</b>（验证：A<sup>b</sup> = 5<sup>4</sup> mod 7 = 2）。</p>\n<p><b>例（2023 年期末）</b>：p=11，g=5，a=6，b=7。A = 5<sup>6</sup> mod 11 = <b>5</b>；B = 5<sup>7</sup> mod 11 = <b>3</b>；K = <b>3</b>。</p>\n<p>课件例：p=23，g=5，a=6，b=15 → A=8，B=19，K=2。</p>\n<p class=\"lab\"><b>mod 技巧</b>：先逐步取余，不要直接算大数。a<sup>n</sup> mod p 可以用 a<sup>2</sup>、a<sup>4</sup> 逐次平方再取余。</p></div><div class=\"card\" style=\"margin-top:12px\"><h3>必会：RSA（P4-67 ~ P4-86）</h3><table><tr><th>步骤</th><th>公式</th></tr>\n<tr><td>1</td><td>选两个大素数 <b>p, q</b></td></tr>\n<tr><td>2</td><td><b>N = p × q</b>（模数）</td></tr>\n<tr><td>3</td><td><b>φ(N) = (p−1)(q−1)</b></td></tr>\n<tr><td>4</td><td>选公钥 <b>e</b>：1 &lt; e &lt; φ(N)，且 <b>gcd(e, φ) = 1</b>（e 与 p−1、q−1 无公因子）</td></tr>\n<tr><td>5</td><td>求私钥 <b>d</b>：<b>e·d ≡ 1 (mod φ)</b>，即 d = (k·φ + 1) / e，取使结果为整数的最小 k</td></tr>\n<tr><td>加密</td><td><b>C = M<sup>e</sup> mod N</b>（M &lt; N）</td></tr>\n<tr><td>解密</td><td><b>M = C<sup>d</sup> mod N</b></td></tr>\n<tr><td>签名</td><td><b>S = M<sup>d</sup> mod N</b>；验证 <b>M = S<sup>e</sup> mod N</b></td></tr></table>\n<p><b>课件例</b>：p=5，q=11 → N=55，φ=40；e=3 → d=(2×40+1)/3=<b>27</b>；加密 M=32：32<sup>3</sup> mod 55 = <b>43</b>；解密 43<sup>27</sup> mod 55 = <b>32</b>。</p>\n<p><b>2025 年期末</b>：p=5，q=13 → N=65，φ=48。Bob e=7 → d=<b>7</b>（7×7=49≡1）；Alice e=5 → d=<b>29</b>（5×29=145=3×48+1）。Bob 给 Alice 发 m=10，<b>用 Alice 的公钥</b>：C = 10<sup>5</sup> mod 65 = <b>30</b>；Alice 解密 30<sup>29</sup> mod 65 = <b>10</b>。</p>\n<p><b>Q&amp;A 例</b>：p=43，q=59，e=13 → N=2537，φ=2436，d=<b>937</b>；STOP 分块 1819 1415 → 密文 <b>2081 2182</b>。</p>\n<p>RSA 的安全性来自<b>分解大数的困难</b>；<b>p、q 必须保密</b>（知道其一就能得到 φ）。公钥推荐 e = 65537。</p></div><div class=\"card\" style=\"margin-top:12px\"><h3>公钥算法的其他内容</h3><ul style=\"margin:6px 0;padding-left:20px\"><li><b>ElGamal</b>（1985）：基于离散对数；<b>密文是明文的两倍大，慢</b>；既有加密也有签名。</li><li><b>ECC</b>（Koblitz 和 Miller 1985，2005 年起广泛使用）：同等安全性所需密钥更短，加密货币广泛采用。</li><li><b>同等安全的密钥长度</b>：RSA 1024 ≈ ECC 160 ≈ 对称 80；RSA 2048 ≈ ECC 224 ≈ 对称 112；RSA 3072 ≈ ECC 256 ≈ 对称 128；RSA 15360 ≈ ECC 512 ≈ 对称 256。</li><li><b>Hybrid 混合系统</b>：公钥加密只用来传一个随机的<b>会话密钥</b>，之后用对称加密传数据 → 兼得对称的速度和公钥的密钥管理。SSL/TLS 就是这样。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>对称 vs 非对称</h3><table><tr><th></th><th>Symmetric</th><th>Asymmetric</th></tr><tr><td>密钥</td><td>一把</td><td>两把（公钥 + 私钥）</td></tr><tr><td>速度</td><td>快</td><td>慢</td></tr><tr><td>密钥分发</td><td>困难</td><td>容易（公钥可公开）</td></tr><tr><td>用途</td><td>批量数据加密</td><td>密钥交换、数字签名</td></tr></table></div><div class=\"card\" style=\"margin-top:12px\"><h3>哈希（P4-107 ~ P4-111）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li>哈希函数性质：①任意长度输入；②<b>固定长度输出</b>；③易计算；④<b>单向</b>（pre-image resistant）；⑤抗弱碰撞；⑥<b>抗强碰撞</b>。输入改一点，输出完全不同。</li><li><b>Hashing vs Encryption</b>：哈希输出短且固定，<b>不可逆</b>；加密输出与明文差不多长，<b>可解密</b>。</li><li><b>MD5</b>（128 位）、<b>SHA-1</b>（160 位）都<b>不安全</b>；<b>SHA-2</b>（SHA-224/256/384/512）更安全，但更耗算力。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>数字签名与证书（P4-103 ~ P4-124）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li><b>签名流程</b>（Bob → Alice）：Bob 对消息做<b>哈希得到摘要</b> → 用 <b>Bob 的私钥</b>加密摘要得到<b>签名</b> → 发送消息 + 签名。Alice 用 <b>Bob 的公钥</b>解密签名得到<b>预期摘要</b>，自己再对消息哈希，<b>两者相同才有效</b>。</li><li>提供：<b>完整性</b>（哈希）+ <b>认证 + 不可否认</b>（私钥）。<b>签名不提供机密性</b>；要保密还需用 Alice 的公钥加密消息（with message protection）。</li><li><b>数字证书</b>：由 CA 签发，证明某个公钥属于某人。X.509 字段：版本、<b>Issuer</b>（CA）、<b>Serial number</b>、<b>Subject</b>（真实主体）、<b>Public key</b>、公钥算法、CA 的<b>数字签名</b>、签名算法。</li><li><b>验证证书三步</b>：①用 <b>CA 的公钥</b>验证证书上的签名（真实、未被改）；②检查<b>有效期</b>；③检查是否被<b>吊销</b>（须询问 CA，可用 <b>OCSP</b>，靠序列号）。</li><li>CA 例：Verisign、GlobalSign、Netrust。很多 CA 未受监管，只应接受<b>信誉良好的 CA</b>。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>易错点</h3><ul style=\"margin:6px 0;padding-left:20px\"><li><b>DH 只交换密钥</b>，不加密消息；RSA 是完整系统。</li><li>加密用<b>接收方的公钥</b>；签名用<b>发送方的私钥</b>。别颠倒。</li><li>RSA 中 <b>d 是 e 对 φ(N) 的模逆</b>（不是对 N）。</li><li>哈希<b>不能“解哈希”</b>；加密可以解密。</li><li>DES 密钥 56 位（块 64 位）；AES 块 <b>128</b> 位，密钥 128/192/256。</li><li>签名用来<b>认证和防抵赖</b>，不用来保密。</li><li>计算大数 mod 时<b>逐步取余</b>，别直接算指数。</li></ul></div>", "5": "<div class=\"card\" style=\"margin-top:0px\"><h3>Web 威胁与 HTTP / HTTPS（P5-3 ~ P5-5）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li>HTTP 简单、<b>无状态</b>、不安全。威胁：<b>完整性</b>（数据篡改、插入）、<b>机密性</b>（窃听）、<b>认证</b>（冒充）、<b>DoS</b>。</li><li><b>HTTPS = HTTP + TLS/SSL</b>；HTTP 用端口 <b>80</b>（不加密、无认证、可被修改），HTTPS 用端口 <b>443</b>（加密、验证服务器身份、防篡改，略慢）。</li><li>HTTP 方法：GET（取）、POST（送）、PUT（改）、DELETE（删）、HEAD（只取头）。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>SSL / TLS 历史（P5-8 ~ P5-10, P5-27）</h3><table><tr><th>版本</th><th>年份</th><th>状态</th></tr><tr><td>SSL 2.0</td><td>1995</td><td>过时，弱，可被中间人攻击</td></tr><tr><td>SSL 3.0</td><td>1996</td><td>已弃用；<b>POODLE</b> 攻击</td></tr><tr><td>TLS 1.0</td><td>1999</td><td>弃用；易受降级攻击、<b>BEAST</b></td></tr><tr><td>TLS 1.1</td><td>2006</td><td>弃用</td></tr><tr><td>TLS 1.2</td><td>2008</td><td>安全（AES-GCM、SHA-256），仍常用</td></tr><tr><td>TLS 1.3</td><td>2018</td><td><b>最安全</b>：更快、前向保密、去掉弱算法</td></tr></table></div><div class=\"card\" style=\"margin-top:12px\"><h3>SSL/TLS 架构与握手（P5-12 ~ P5-17）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li>两层：上层 <b>Handshake、Change Cipher Spec、Alert</b> 三个协议；下层 <b>Record Protocol</b>（提供机密性和消息完整性）。</li><li><b>Session</b>（会话，由握手创建，可被多个连接共用）vs <b>Connection</b>（连接，端到端的安全通信）。</li><li><b>Record 协议步骤</b>：分片 → 压缩 → <b>加 MAC</b> → <b>加密</b> → 加记录头。</li><li>密钥长度：公钥 512 位弱、1024 可被破、推荐 <b>2048</b> 位；会话密钥一般 40–256 位，低于 128 位不安全；会话密钥更短是因为只保护一次会话，也降低服务器负担。</li></ul><table><tr><th>握手消息</th><th>发送方</th><th>含义</th></tr><tr><td>Client Hello</td><td>客户端</td><td>请求安全连接，列出支持的密码套件</td></tr><tr><td>Server Hello</td><td>服务器</td><td>愿意继续，选定密码套件</td></tr><tr><td>Certificate</td><td>服务器</td><td>发送含公钥的数字证书</td></tr><tr><td>ServerHello Done</td><td>服务器</td><td>服务器这部分完成</td></tr><tr><td>ClientKeyExchange</td><td>客户端</td><td>生成<b>随机对称会话密钥</b>，用服务器公钥加密后发送</td></tr><tr><td>Change Cipher Spec</td><td>客户端</td><td>把选定的密码套件由 pending 变成 active</td></tr><tr><td>Finish</td><td>客户端</td><td>客户端部分完成，开始正式通信</td></tr></table></div><div class=\"card\" style=\"margin-top:12px\"><h3>必会：RSA 密钥交换 vs DH 与 TLS 1.3（P5-18 ~ P5-27）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li>TLS 是<b>混合</b>密码系统：公钥密码学只用于交换密钥，之后用对称加密数据。</li><li><b>RSA 密钥交换</b>：客户端决定共享密钥，用服务器公钥加密发送。<b>缺点：没有前向保密（not forward secret）</b>——有人先录下加密流量，将来拿到服务器 RSA 私钥，就能解密<b>过去所有</b>通信。</li><li><b>Diffie-Hellman</b>：双方各生成密钥对、交换公钥部分，各自算出同一个 pre-master secret；服务器用<b>数字签名</b>保证交换没被篡改。每次交换都换新密钥对的叫 <b>ephemeral（临时）</b>。</li><li><b>TLS 1.3 的改进</b>：只保留 <b>ephemeral DH</b>（去掉 RSA 密钥交换）→ <b>Perfect Forward Secrecy</b>；握手往返由 <b>2 次减到 1 次</b>；支持的密码套件由 <b>37 减到 5</b>；去掉 3DES、DES、MD5、RC4、SHA-1；签名算法允许 RSA（仅签名）、ECDSA、EdDSA；新增 ChaCha20。</li><li><b>forward secrecy 一句话</b>：就算以后长期私钥泄露，过去的会话也不会被解开。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>常见攻击与缓解（P5-28）</h3><table><tr><th>攻击</th><th>说明</th><th>缓解</th></tr><tr><td>MITM</td><td>拦截通信</td><td>HTTPS，验证证书</td></tr><tr><td>Downgrade</td><td>强迫使用旧版 TLS/SSL</td><td>禁用 TLS 1.0/1.1，强制 1.2 或 1.3</td></tr><tr><td>BEAST</td><td>利用 TLS 1.0 弱点</td><td>升级到 TLS 1.2/1.3</td></tr><tr><td>POODLE</td><td>SSL 3.0 漏洞</td><td>禁用 SSL 3.0</td></tr><tr><td>Heartbleed</td><td>OpenSSL 漏洞，泄露内存</td><td>更新 OpenSSL 补丁</td></tr><tr><td>DROWN</td><td>利用配置不当服务器上的 SSLv2</td><td>禁用 SSLv2 和弱密码</td></tr></table></div><div class=\"card\" style=\"margin-top:12px\"><h3>SSL/TLS 的局限与最佳实践</h3><ul style=\"margin:6px 0;padding-left:20px\"><li><b>不能</b>：认证计算机的实际操作者、商家身份、实际在线消费者；防止被盗信用卡的使用；保护数据库（只保护<b>传输中</b>的数据）。拖慢服务器；证书有成本；是<b>两方</b>协议。</li><li>服务器侧：用 TLS 1.2/1.3、强密码套件、开启 PFS、<b>HSTS</b>、<b>OCSP stapling</b>、及时更新 OpenSSL。客户端：验证证书、<b>证书固定（pinning）</b>、禁用弱协议。选信誉好的 CA，妥善保管私钥。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>SET vs SSL（P5-31 ~ P5-38）</h3><table><tr><th></th><th>SET</th><th>SSL/TLS</th></tr><tr><td>目的</td><td>信用卡支付（电商支付机制）</td><td>加密传输数据</td></tr><tr><td>参与方</td><td><b>多方</b>：持卡人、商家、银行，全部需认证</td><td><b>两方</b></td></tr><tr><td>认证</td><td>所有参与方都用数字证书，<b>很强</b></td><td>只认证服务器，不太强</td></tr><tr><td>加密</td><td><b>消息</b>加密</td><td><b>通道</b>加密</td></tr><tr><td>商家能否看到卡信息</td><td>不能（交给支付网关）</td><td>能，商家看得到</td></tr><tr><td>抗抵赖</td><td>客户要对支付指令数字签名；<b>商家和持卡人都难抵赖</b></td><td>不能提供抗抵赖</td></tr><tr><td>现状</td><td>几乎不用（需特殊软件）</td><td>广泛使用</td></tr></table><p class=\"lab\">SET 由 MasterCard、Visa、Microsoft、IBM、Netscape 等于 1996 年设计。SET 里：机密性用对称加密，授权用 RSA 公钥，完整性用哈希。SET 不会取代 SSL。</p></div><div class=\"card\" style=\"margin-top:12px\"><h3>防火墙基础（P5-42 ~ P5-54）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li><b>Firewall</b>：按事先设定的安全策略<b>监控并过滤</b>进出流量，位于私有网络与公网之间；允许无威胁流量进、挡住危险流量。</li><li><b>硬件防火墙</b>保护整个网络、在路由器层、较贵难配置；<b>软件防火墙</b>保护单台电脑、较便宜。</li><li>防火墙只丢弃<b>可证明是攻击</b>的包，所以有些攻击包能通过。<b>Ingress</b> 入站、<b>Egress</b> 出站。</li><li><b>规则匹配</b>：按顺序<b>第一条匹配的规则生效</b>；最后一条通常是 <b>Deny any any</b>（默认拒绝）。例：Rule1 允许来自 192.168.1.0/24、端口 80；Rule2 拒绝到 10.0.0.5、端口 22；Rule3 拒绝其余。</li><li><b>个人防火墙</b>：能阻止黑客、控制哪些程序能上网；<b>不能</b>防邮件病毒，需要杀毒软件，也要定期更新规则。</li><li><b>优点</b>：增强安全、过滤流量、日志与告警。<b>缺点</b>：影响性能、配置复杂、<b>防不了内部威胁</b>、可被隧道和加密绕过、防不了社会工程和零日。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>防火墙类型（P5-55 ~ P5-68）</h3><table><tr><th>类型</th><th>特点</th><th>优缺点</th></tr><tr><td><b>Packet filtering</b> 包过滤</td><td>只看包头（源/目的 IP、端口）；<b>无状态</b>；静态/动态</td><td>快、便宜；<b>无深度检查</b>，防不了很多攻击（能防伪造 IP）</td></tr><tr><td><b>Stateful inspection (SPI)</b> 状态检测</td><td>用<b>状态表</b>记录连接（IP、端口、序列号）；只允许响应内部发起的入站 TCP</td><td>比包过滤更安全，<b>现代边界防火墙几乎都用</b>；缺点：处理状态表更耗资源，可能被 DoS</td></tr><tr><td><b>Proxy / Application gateway</b> 代理</td><td>用户→代理→目标；代理验证请求合法后代为执行；完全理解协议</td><td>最安全、易审计；<b>慢</b></td></tr><tr><td><b>NGFW</b> 下一代</td><td>传统功能 + IPS + 深度包检测 + 应用感知</td><td>更强，更贵</td></tr><tr><td>Cloud / WAF</td><td>云托管；WAF 保护 Web 应用（SQL 注入、XSS）</td><td>—</td></tr></table><p><b>排序（课件 P5-68）</b>：速度 包过滤最快、代理最慢；安全性 代理最高、包过滤最低；SPI 居中。</p></div><div class=\"card\" style=\"margin-top:12px\"><h3>防火墙架构（P5-69 ~ P5-75）</h3><table><tr><th>架构</th><th>说明</th></tr><tr><td>Packet filtering router</td><td>路由器当第一代防火墙；缺乏审计和强认证</td></tr><tr><td>Screened host / Single host</td><td>包过滤路由器 + 专用堡垒主机（bastion host，应用代理）；堡垒主机是攻击目标，必须加固；若被攻破则内部暴露</td></tr><tr><td>Dual-homed host</td><td>一台主机两个网卡（一个接外网，一个接内网），可做 NAT；比 screened host 更安全，但仍是<b>单点故障</b></td></tr><tr><td><b>Screened subnet</b></td><td><b>两个防火墙/路由器之间建 DMZ</b>，公共服务（Web 服务器）放 DMZ；三层防御，<b>内网对互联网不可见</b>，最安全</td></tr></table><p class=\"lab\">推荐实践：内网出站全部允许；防火墙本身不可从公网直接访问；SMTP 经网关；<b>ICMP 全部拒绝</b>；阻止从公网 telnet 内部服务器；对外 Web 服务用代理或 DMZ。</p></div><div class=\"card\" style=\"margin-top:12px\"><h3>必会计算：防火墙吞吐量</h3><p><b>所需 pps = 带宽(bit/s) ÷ (包字节数 × 8)</b>；防火墙<b>实际吞吐 = pps 上限 × 包字节数 × 8</b>。</p>\n<p>课件例：1 Gbps、1000 字节 → 需要 10<sup>9</sup> ÷ 8000 = <b>125,000 pps</b>；防火墙能力 200,000 pps → <b>能承受</b>；能力 100,000 pps → <b>不能</b>。</p>\n<p><b>2025 年期末 Q3(a)</b>：防火墙上限 800,000 pps，平均包 8,000 字节，链路 100 Gbps。<br>\n(i) 有效吞吐 = 800,000 × 8,000 × 8 = 5.12 × 10<sup>10</sup> = <b>51.2 Gbps</b>。<br>\n(ii) 51.2 Gbps &lt; 100 Gbps → <b>无法跑满链路</b>（只能承受约一半）。<br>\n(iii) 包 500 字节：800,000 × 500 × 8 = <b>3.2 Gbps</b>（小包攻击下吞吐急剧下降；此时需要 100 Gbps ÷ 4000 bit = 2,500 万 pps）。</p></div><div class=\"card\" style=\"margin-top:12px\"><h3>周界之死与现代做法（P5-79 ~ P5-82）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li>传统：内部可信、外部不可信。周界被侵蚀的原因：<b>云计算</b>、<b>远程办公与 BYOD</b>、<b>Zero Trust</b>、<b>加密流量增加</b>（TLS 隧道绕过）、<b>复杂威胁</b>（钓鱼、内部人员）。</li><li>结论：周界<b>转移了，没有消失</b>。防火墙<b>仍然需要，但不够</b>：配合 NGFW（DPI、IPS）、云防火墙（FWaaS）、<b>网络分段</b>、Zero Trust、终端防护。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>IDS / IPS / 蜜罐（P5-86 ~ P5-95）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li><b>IDS</b>：监控网络或系统活动中的恶意行为，<b>只检测并告警，不阻断</b>。优点：早期发现、实时监控、取证、合规。缺点：<b>误报</b>（anomaly）、<b>漏报</b>（signature 不认新威胁）、资源消耗、不主动防护。</li><li><b>Signature-based</b>（knowledge-based）：匹配预设攻击特征；<b>签名要持续更新</b>；漏报新攻击。<b>Anomaly-based</b>（behavior-based）：先学正常流量的<b>基线</b>，偏离（clipping level）就告警；能发现<b>新攻击</b>，但<b>误报多</b>。</li><li><b>NIDS vs HIDS</b>：见下表。<b>IPS</b>：检测<b>并阻断</b>，主动；放在流量到达系统之前；常集成在 NGFW 中。</li><li><b>蜜罐 Honeypot</b>：诱饵系统，故意留漏洞吸引攻击者，用于<b>收集攻击者信息</b>或分散注意力；局限：<b>只能发现针对它的攻击</b>，不一定能识别攻击者。</li></ul><table><tr><th></th><th>NIDS 网络型</th><th>HIDS 主机型</th></tr><tr><td>监控对象</td><td>网络流量（所有数据包）</td><td>单台主机的日志、审计记录、进出流量</td></tr><tr><td>优点</td><td>覆盖面广、所需系统少、成本较低、能关联多系统攻击</td><td>能看到<b>解密后</b>的数据、<b>误报少</b>、针对 OS/应用、能判断警报对系统的影响</td></tr><tr><td>缺点</td><td><b>加密流量无效</b>；不知道主机内部活动</td><td>每台都要装、成本高、占本机资源</td></tr><tr><td>告警线索</td><td>—</td><td>登录失败、非正常时间登录、权限提升、新增账户</td></tr></table><table><tr><th></th><th>IDS</th><th>IPS</th></tr><tr><td>功能</td><td>检测并告警</td><td>检测并阻断</td></tr><tr><td>响应</td><td>被动（记录和告警）</td><td>主动（实时阻止）</td></tr><tr><td>位置</td><td>监控活动</td><td>在流量到达系统前检查</td></tr><tr><td>例子</td><td>Snort、Zeek、OSSEC</td><td>Palo Alto NGFW、Suricata、Cisco Firepower</td></tr></table></div><div class=\"card\" style=\"margin-top:12px\"><h3>易错点</h3><ul style=\"margin:6px 0;padding-left:20px\"><li>HTTP <b>80</b>，HTTPS <b>443</b>。</li><li>TLS 1.3 <b>只保留 ephemeral DH</b>，去掉 RSA 密钥交换；<b>RSA 密钥交换没有前向保密</b>。</li><li>握手里是<b>客户端</b>生成会话密钥，用<b>服务器公钥</b>加密。</li><li>SET 是<b>多方</b>协议，SSL 是<b>两方</b>；SSL 不提供抗抵赖。</li><li>规则匹配按顺序，<b>第一条匹配的生效</b>；末尾通常是默认拒绝。</li><li>吞吐计算<b>别忘了 ×8</b>；包越小，所需 pps 越高、防火墙越容易成为瓶颈。</li><li>IDS <b>不阻断</b>，IPS 才阻断；NIDS 看不了加密流量。</li><li>Signature 漏报新攻击；Anomaly 误报多。</li><li>防火墙<b>防不了内部威胁</b>。</li></ul></div>"}};

/* ---------- calculations ---------- */
function parseNum(s){ s=String(s).trim().replace(/[,，\s]/g,'').replace(/[x×*]10\^/gi,'e').replace(/×10\^/g,'e'); const v=Number(s); return isFinite(v)?v:NaN; }
const UNITS={'秒':1,'分钟':60,'小时':3600,'天':86400,'年':YEAR};
function pickUnit(sec){ return sec<120?'秒':sec<7200?'分钟':sec<172800?'小时':sec<YEAR*2?'天':'年'; }
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function genBrute(){
  const cs=[[10,'digits 0–9'],[26,'lowercase letters'],[36,'lowercase letters and digits'],[62,'upper/lower-case letters and digits'],[95,'the 95 printable ASCII characters'],[102,'a 102-key keyboard']];
  for(;;){
    const [N,desc]=rnd(cs), L=4+Math.floor(Math.random()*9), rate=rnd([1e6,1e7,1e8,1e9,5e9,1.5e10,8e6,8e9]), k=rnd([1,1,1,1000,1e6]);
    const sec=Math.pow(N,L)/rate/k; if(sec<5||sec>YEAR*1e7) continue;
    return {N,desc,L,rate,k,sec,unit:pickUnit(sec)};
  }
}
function bruteSteps(g){ const comb=Math.pow(g.N,g.L); const t=comb/g.rate, t2=t/g.k;
  return `<p>1. 组合数 = ${g.N}^${g.L} = ${fmtH(comb)}</p><p>2. 时间（秒）= ${fmtH(comb)} ÷ ${fmtH(g.rate)} = ${fmtH(t)} s</p>${g.k>1?`<p>3. ${fmtH(g.k)} 台机器并行：÷ ${fmtH(g.k)} = ${fmtH(t2)} s</p>`:''}<p>${g.k>1?4:3}. 换算：${fmtH(t2)} ÷ ${UNITS[g.unit]} = <b>${fmtH(t2/UNITS[g.unit])} ${g.unit}</b>（1 年 = 3600×24×365 秒）</p>`; }
function genDos(){
  const useK=Math.random()<.4, useG=Math.random()<.35;
  const link=useG?rnd([1,5,10,40]):rnd([1.5,2,10,100,500]); const linkBps=link*(useG?1e9:1e6);
  const size=useK?rnd([1,4,64,256,512]):rnd([64,500,800,1000,1500,8000]); const bytes=useK?size*1024:size;
  const bots=rnd([1,1,1000,5e6]);
  const total=linkBps/(bytes*8);
  return {link,useG,size,useK,bytes,bots,total,per:total/bots,bps:linkBps};
}
function dosSteps(g){ return `<p>1. 带宽 = ${g.link} ${g.useG?'Gbps':'Mbps'} = ${fmtH(g.bps)} bit/s</p><p>2. 包大小 = ${g.useK?g.size+'K = '+g.size+' × 1024 = ':''}${fmtH(g.bytes)} 字节 = ${fmtH(g.bytes)} × 8 = <b>${fmtH(g.bytes*8)} bit</b>（先 ×8！）</p><p>3. 总包/秒 = ${fmtH(g.bps)} ÷ ${fmtH(g.bytes*8)} = <b>${fmtH(g.total)}</b></p>${g.bots>1?`<p>4. 每台僵尸机 = ${fmtH(g.total)} ÷ ${fmtH(g.bots)} = <b>${fmtH(g.per)}</b> 包/秒</p>`:''}`; }

  <div class="card"><h3>暴力破解</h3><label>字符集大小 N<input type="number" id="bn" value="95"></label><label>密码长度 L<input type="number" id="bl" value="10"></label><label>每秒尝试次数<input type="text" id="br" value="1.5e10"></label><label>并行机器数<input type="text" id="bk" value="1"></label><div id="bo" class="note" style="margin-top:10px"></div></div>
  <div class="card"><h3>DoS 包数</h3><label>带宽数值<input type="text" id="dl" value="10"></label><label>单位<select id="du"><option value="1e6">Mbps</option><option value="1e9" selected>Gbps</option></select></label><label>包大小<input type="text" id="ds" value="64"></label><label>包大小单位<select id="dk"><option value="1">字节</option><option value="1024" selected>K 字节（×1024）</option></select></label><label>僵尸机数量<input type="text" id="db" value="5e6"></label><div id="do" class="note" style="margin-top:10px"></div></div></div>`;
  const b=()=>{ const N=+$('#bn').value,L=+$('#bl').value,rate=parseNum($('#br').value),k=parseNum($('#bk').value)||1; if(!(N>0&&L>0&&rate>0)){ $('#bo').textContent='请输入有效数字'; return; } const sec=Math.pow(N,L)/rate/k; const u=pickUnit(sec); $('#bo').innerHTML=bruteSteps({N,L,rate,k,sec,unit:u}); };
  const d=()=>{ const link=parseNum($('#dl').value), un=+$('#du').value, size=parseNum($('#ds').value), kk=+$('#dk').value, bots=parseNum($('#db').value)||1; if(!(link>0&&size>0)){ $('#do').textContent='请输入有效数字'; return; } const bps=link*un, bytes=size*kk, total=bps/(bytes*8); $('#do').innerHTML=dosSteps({link,useG:un===1e9,size,useK:kk===1024,bytes,bots,total,per:total/bots,bps}); };
  ['bn','bl','br','bk'].forEach(i=>$('#'+i).oninput=b); ['dl','du','ds','dk','db'].forEach(i=>$('#'+i).oninput=d); b(); d();
}
/* ---------- plan ---------- */
function vPlan(){
  const pl=st('plan'); const ti=todayIdx();
  const phase={learn:['学新内容','10/7 – 10/13',''],review:['间隔复习与模拟','10/14 – 10/27','amber'],sprint:['冲刺','10/28 – 10/30','rose']};
  let doneDays=0; D.plan.forEach((d,i)=>{ if(d.slice(2).every((_,k)=>pl[i+'-'+k])) doneDays++; });
  let html=`<h1>打卡计划</h1><p class="sub">10/7 – 10/30。前四讲已学完，只有第 5 讲是新内容。每一讲的复习按【①②③】间隔安排（约隔 3 天、7 天）。已完成 ${doneDays} / 24 天。</p><div class="bar2"><i style="width:${doneDays/24*100}%"></i></div>`; let lastP=null;
  D.plan.forEach((d,i)=>{ if(d[0]!==lastP){ html+=`<h2>${phase[d[0]][0]} <span class="lab">${phase[d[0]][1]}</span></h2>`; lastP=d[0]; }
    const date=new Date(2026,9,7+i); const lab=(date.getMonth()+1)+'/'+date.getDate()+' '+'日一二三四五六'[date.getDay()].replace(/^/,'周');
    const items=d.slice(2);
    const all=items.every((_,k)=>pl[i+'-'+k]);
    html+=`<div class="card day ${i===ti?'today':''} ${all?'done':''}" style="margin:8px 0"><div class="row"><b>${lab}</b><span class="tag ${phase[d[0]][2]}">Day ${i+1} · ${esc(d[1])}</span>${i===ti?'<span class="tag green">今天</span>':''}${all?'<span class="tag green">已完成</span>':''}</div>${items.map((t,k)=>`<label class="chk" style="color:var(--ink);font-size:15px"><input type="checkbox" data-i="${i}-${k}" ${pl[i+'-'+k]?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div>`; });
  $('#app').innerHTML=html;
  document.querySelectorAll('input[data-i]').forEach(c=>c.onchange=()=>{ if(c.checked) pl[c.dataset.i]=1; else delete pl[c.dataset.i]; save(); const y=window.scrollY; vPlan(); window.scrollTo(0,y); });
}

  <div class="card" style="margin-top:12px"><h3>关于选择题答案</h3><p>答案取自 Sample Quiz PDF 上的红色下划线，用程序识别后抽查核对过。<b>Part 5 第 17 题</b>：红线标的是 D（Anomaly detection），但题干描述的是“一组规则或攻击模式”，一般对应 Signature detection（B），疑似标错，以老师为准。</p></div>`; }

/* ---------- reset ---------- */
function vReset(a,msg){
  const cnt=o=>Object.keys(o||{}).length;
  const items=[
   ['mcq','选择题答题记录',cnt(S.mcq)+' 题已做',['mcq']],
   ['wrong','错题本',cnt(S.wrong)+' 道',['wrong']],
   ['chk','模块自测（第 1 讲）',cnt(S.chk)+' 条记录（含你写的答案）',['chk']],
   ['sa','简答论述',cnt(S.sa)+' 条记录（含你写的答案）',['sa']],
   ['calc','计算题（固定真题 + 随机练习的累计成绩）',cnt(S.ca)+' 条固定题记录 · 随机练习 '+((S.gen&&S.gen.n)||0)+' 题',['ca','gen']],
   ['plan','打卡计划',cnt(S.plan)+' 项已勾选',['plan']]];
  $('#app').innerHTML=`<h1>清零</h1><p class="sub">进度只保存在这个浏览器里。清零后不能恢复。想重新刷一遍，可以单独清零某一项，也可以一键全部回到初始状态。</p>
  ${msg?`<div class="note green">${esc(msg)}</div>`:''}
  <div class="card" style="border-color:var(--rose)"><h3 style="color:var(--rose)">一键全部清零</h3><p>清掉上面所有进度（保留明暗主题和 Quiz/Final 日期设置）。</p><div class="row"><button class="btn warn" id="all">全部清零</button></div></div>
  <h2>单项清零</h2>
  ${items.map(([k,t,c])=>`<div class="card" style="margin:8px 0"><div class="row" style="justify-content:space-between"><div><b>${t}</b><div class="lab">${c}</div></div><button class="btn ghost" data-k="${k}">清零</button></div></div>`).join('')}
  <h2>按章清零选择题</h2><div class="row">${[1,2,3,4,5].map(p=>`<button class="btn ghost" data-p="${p}">Part ${p}</button>`).join('')}</div>`;
  $('#all').onclick=()=>{ if(confirm('确定全部清零？所有答题记录、错题本、自测、打卡都会清除，不能恢复。')){ const keep={theme:S.theme,dates:S.dates}; S={}; if(keep.theme) S.theme=keep.theme; if(keep.dates) S.dates=keep.dates; save(); mock=null; vReset(a,'已全部清零，可以重新开始。'); } };
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ const it=items.find(x=>x[0]===b.dataset.k); if(confirm('确定清零“'+it[1]+'”？')){ it[3].forEach(k=>{ delete S[k]; }); if(it[0]==='mcq'){} save(); vReset(a,'已清零：'+it[1]); } });
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ const p=+b.dataset.p; if(confirm('清零 Part '+p+'？这一章的错题也会移出错题本。')){ ALL.filter(q=>q.p===p).forEach(q=>{ delete mq()[q.id]; delete wr()[q.id]; }); save(); vReset(a,'已清零 Part '+p); } });
}
render();
</script>
