<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EE6102 刷题站</title>
<style>
:root{
  --bg:#f6f9fb; --card:#ffffff; --ink:#0b1f33; --muted:#5b6b7b; --line:#d9e2ea;
  --teal:#0f8b8d; --teal-soft:#e2f3f3; --amber:#e09f3e; --amber-soft:#fff3dc; --rose:#d1495b; --rose-soft:#fde8eb; --green:#1e8a4c; --green-soft:#e4f5ea; --navy:#0b1f33;
  --shadow:0 1px 2px rgba(11,31,51,.06),0 4px 14px rgba(11,31,51,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1722; --card:#13212f; --ink:#e8eff5; --muted:#9db0c1; --line:#243648;
    --teal:#35b7b9; --teal-soft:#10353a; --amber:#f0b45a; --amber-soft:#3a2f17; --rose:#ef6b7c; --rose-soft:#3d1c23; --green:#4cc27f; --green-soft:#12352341; --navy:#e8eff5;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1722; --card:#13212f; --ink:#e8eff5; --muted:#9db0c1; --line:#243648;
  --teal:#35b7b9; --teal-soft:#10353a; --amber:#f0b45a; --amber-soft:#3a2f17; --rose:#ef6b7c; --rose-soft:#3d1c23; --green:#4cc27f; --green-soft:#123523; --navy:#e8eff5;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (min-width:900px){html{zoom:1.25}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;color:var(--navy);font-size:18px;margin-right:6px}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{padding:6px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:15px}
nav a.on{background:var(--teal-soft);color:var(--teal);font-weight:600}
nav a:hover{color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:14px}
main{max-width:1200px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:26px;margin:6px 0 4px;color:var(--navy)}
h2{font-size:20px;margin:26px 0 10px;color:var(--navy)}
h3{font-size:16px;margin:16px 0 6px;color:var(--teal)}
p{margin:6px 0}
.sub{color:var(--muted);margin:0 0 16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card.link{cursor:pointer;transition:transform .12s,border-color .12s}
.card.link:hover{border-color:var(--teal);transform:translateY(-1px)}
.big{font-size:34px;font-weight:700;line-height:1.1;color:var(--teal)}
.lab{color:var(--muted);font-size:13px}
.bar2{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar2>i{display:block;height:100%;background:var(--teal)}
.btn{display:inline-block;border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:10px;padding:8px 16px;cursor:pointer;font:inherit;font-size:15px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--teal)}
.btn.warn{background:var(--rose);border-color:var(--rose)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--teal-soft);color:var(--teal);margin-right:6px}
.tag.amber{background:var(--amber-soft);color:var(--amber)} .tag.rose{background:var(--rose-soft);color:var(--rose)} .tag.green{background:var(--green-soft);color:var(--green)}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;margin:8px 0;cursor:pointer;font:inherit}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt b{min-width:20px;color:var(--teal)}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--rose);background:var(--rose-soft)}
.opt:disabled{cursor:default}
.note{border-radius:12px;padding:10px 14px;margin:10px 0;background:var(--teal-soft);font-size:15px}
.note.amber{background:var(--amber-soft)} .note.green{background:var(--green-soft)} .note.rose{background:var(--rose-soft)}
.qgrid{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.qgrid button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit;font-size:13px}
.qgrid button.ok{background:var(--green-soft);border-color:var(--green)}
.qgrid button.no{background:var(--rose-soft);border-color:var(--rose)}
.qgrid button.cur{outline:2px solid var(--teal)}
textarea,input[type=text],input[type=number],select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
label{font-size:14px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14.5px;margin:8px 0}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--navy);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) th{background:#1c3347}}
:root[data-theme="dark"] th{background:#1c3347}
tr:nth-child(even) td{background:rgba(15,139,141,.05)}
.tabs{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:14px}
.tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.chk input{width:20px;height:20px;margin-top:4px;accent-color:var(--teal)}
.day.today{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-soft)}
.day.done{opacity:.7}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;color:var(--rose)}
code,.mono{font-family:Consolas,"JetBrains Mono",monospace;background:var(--teal-soft);padding:1px 6px;border-radius:6px;font-size:14px}
.ans p{margin:6px 0}
.en{font-family:"Segoe UI",system-ui,sans-serif}
a{color:var(--teal)}
@media (max-width:560px){h1{font-size:22px} .big{font-size:28px}}
</style>
</head>
<body>
<header><div class="bar">
  <span class="brand">EE6102 刷题站</span>
  <nav id="nav"></nav>
  <button class="iconbtn" id="theme" title="切换明暗">明/暗</button>
</div></header>
<main id="app"></main>

<script>
const D = {"quiz": {"1": [{"n": 1, "q": "What is cyber security?", "opts": {"A": "It is the collection of technologies, standards, policies and management practices that are applied to digital information to keep it secure", "B": "It is only using technology to keep digital information secure", "C": "It is just using the best policy to keep digital information secure", "D": "None of the above"}, "ans": "A", "hint": "网络安全是技术 + 标准 + 政策 + 管理的综合，不是单靠技术或政策。"}, {"n": 2, "q": "Why is cyber security important?", "opts": {"A": "In today's high technology environment, organisations are becoming more and more dependent on their information systems", "B": "Due to hype in the media about cyber security", "C": "The threats from traditional brick and motor criminals are on the rise", "D": "Many organisations who are still using offline payment system are depending on cyber security"}, "ans": "A", "hint": "关键词：dependent on information systems。"}, {"n": 3, "q": "What are the three basic cyber security concepts?", "opts": {"A": "Confidentiality, Integrity and Access", "B": "Consideration, Integrity, and Availability", "C": "Confidentiality, Integrity, Availability", "D": "None of the above"}, "ans": "C", "hint": "CIA。"}, {"n": 4, "q": "You visit an organization’s website and you realized that you are able to view sensitive files on their web server. Even though it is not your fault, it is still considered a cyber security breach?", "opts": {"A": "True", "B": "False"}, "ans": "A"}, {"n": 5, "q": "Verifying that users are who they say they are and that each input arriving at the system came from a trusted source.", "opts": {"A": "Authenticity", "B": "Integrity", "C": "Confidentiality", "D": "None of the above"}, "ans": "A", "hint": "对应Authentication / Authenticity。"}, {"n": 6, "q": "List the three stages in the plan-protect-respond cycle.", "opts": {"A": "Planning, protection, and response", "B": "Planning, Checking and protecting", "C": "Plan, do and check", "D": "None of the above"}, "ans": "A"}, {"n": 7, "q": "In plan, protect and response cycle, which stage consumes the most time?", "opts": {"A": "Protection", "B": "Planning", "C": "Response", "D": "All three take the same time"}, "ans": "A"}, {"n": 8, "q": "How is protection defined?", "opts": {"A": "Protection is defined as the plan-based creation of operation and countermeasures", "B": "To use technologies to protect against attacks", "C": "To use policy-based protection to protect against attacks", "D": "All of the above"}, "ans": "D"}, {"n": 9, "q": "How is the response defined?", "opts": {"A": "Response is defined as recovery according to plan", "B": "Punish the attackers so that they don’t attack again", "C": "Attack the attackers and destroy their abilities to attack again", "D": "None of the above"}, "ans": "A", "hint": "响应是“按计划恢复”，不是反击。"}, {"n": 10, "q": "Why there is need to understand cyber security Threat landscape?", "opts": {"A": "We will not be able to defend as we will not know how are the attackers and how are they going to attack us", "B": "Business requirements make it essential to understand it", "C": "It is requirement of information cyber security policy, so we have no choice", "D": "None of the above"}, "ans": "A"}, {"n": 11, "q": "Automation, speed and action at distance are adding online attack?", "opts": {"A": "True", "B": "False"}, "ans": "A"}, {"n": 12, "q": "Most obvious reason (s) for cyber security attacks is (are):", "opts": {"A": "Privacy violations", "B": "Criminal attacks", "C": "Publicity attacks", "D": "Legal attacks", "E": "All of the above"}, "ans": "E", "hint": "题目选项中criminal、privacy、publicity 都是；以讲义答案为准。"}, {"n": 13, "q": "The fabrication of information that is purported to be from someone who is not actually the author is called", "opts": {"A": "Masquerading", "B": "Eavesdropping", "C": "Spoofing", "D": "None of the above"}, "ans": "A", "hint": "冒充别人伪造信息 = Masquerading（伪装）。注意不是 Spoofing。"}, {"n": 14, "q": "Malware is a generic term for “evil/malicious software”", "opts": {"A": "True", "B": "False"}, "ans": "A"}, {"n": 15, "q": "Distinguish between viruses and worms", "opts": {"A": "Virus needs a host program while worms are full program and don’t need a host program", "B": "Both are same", "C": "Worm cannot be detected by antivirus program, while virus can be detected", "D": "None of the above"}, "ans": "A", "hint": "必考。"}, {"n": 16, "q": "The interruption or degradation of a data service or information access is called", "opts": {"A": "Denial of service", "B": "Non-repudiation", "C": "Masquerading", "D": "None of the above"}, "ans": "A"}, {"n": 17, "q": "How do most viruses spread between computers today?", "opts": {"A": "Mostly via email messages, but also through thumb drives, file sharing programs, downloading infected programs from a malicious website, social networking sites.", "B": "By installing mobile applications", "C": "Hackers cracking your password", "D": "None of the above"}, "ans": "A"}, {"n": 18, "q": "What is a Logic Bomb?", "opts": {"A": "It gives the impression that it is useful program however in reality it is harmful", "B": "Malicious codes that execute when a certain predefined events occurs.", "C": "A Virus which bypasses the antivirus program", "D": "None of the above"}, "ans": "B", "hint": "A 是木马的定义。"}, {"n": 19, "q": "What are the likely motivations for hackers", "opts": {"A": "Financial gain, publicity and espionage", "B": "They are too smart and want people to know about it", "C": "They do it for a challenge", "D": "They do it as they are bored", "E": "All of the above"}, "ans": "E", "hint": "动机包括经济利益、名气、间谍、挑战、无聊，这题选 All of the above。"}, {"n": 20, "q": "What is a virus or worm payload?", "opts": {"A": "It is a virus or worm designed for mobile devices", "B": "Payloads are pieces of code that do damage", "C": "Payload is just a computer jargon for virus", "D": "None of the above"}, "ans": "B", "hint": "Payload = 造成破坏的那部分代码。"}, {"n": 21, "q": "What is the definition of hacking.", "opts": {"A": "When you share your password with someone", "B": "Hacking is intentionally accessing a computer resource without authorization or in excess of authorization.", "C": "When you reset your password and don’t encrypt it", "D": "None of the above"}, "ans": "B"}, {"n": 22, "q": "What is spyware?", "opts": {"A": "Spyware refers to a broad spectrum of Trojan horse programs that gather information about you and make it available to an attacker.", "B": "When you visit a suspicious website and are infected", "C": "When you browse a website, and you are infected with adware", "D": "None of the above"}, "ans": "A"}, {"n": 23, "q": "Why can cookies be dangerous?", "opts": {"A": "Cookies can record too much sensitive information about you and could become spyware", "B": "Cookies can never be dangerous as it is now legally allowed on any web sites", "C": "Cookies were only dangerous in the past", "D": "None of the above"}, "ans": "A"}, {"n": 24, "q": "What is social engineering?", "opts": {"A": "Social Engineering means using social networks", "B": "Social engineering attacks take advantage of flawed human judgment by convincing the victim to take actions that are counter to security policies.", "C": "Social Engineering is technical term for reverse engineering in IT field", "D": "None of the above"}, "ans": "B"}, {"n": 25, "q": "What is spam?", "opts": {"A": "Spam is unsolicited commercial e-mail.", "B": "When your computer is infected with a ransomware", "C": "When your mailbox is full", "D": "None of the above"}, "ans": "A"}, {"n": 26, "q": "What is phishing?", "opts": {"A": "Phishing means when your computer has a virus", "B": "Phishing attack victims receive an email message that appears to come from a bank or another firm with which the victim does business", "C": "It is a technical term for Ransomware", "D": "A and C"}, "ans": "B"}, {"n": 27, "q": "How can social engineering be used to get access to a sensitive file?", "opts": {"A": "Simply by asking someone to send the file or to give access to the file by tricking the user", "B": "Using brute force attack to find password", "C": "Cracking password using social networks", "D": "None of the above"}, "ans": "A"}], "2": [{"n": 1, "q": "The term industry 4 or i4.0 originated in __________ .", "opts": {"A": "USA", "B": "China and Singapore", "C": "Both a and b", "D": "None of the above"}, "ans": "D", "ex": "**选 D。** 课件 P2-3 写明：工业 4.0 这个词是 2015 年底到 2016 年初在**德国**由世界经济论坛的 Klaus Schwab 正式提出的。A（美国）、B（中国和新加坡）、C 都不对，所以选“以上都不是”。\n\n**技巧**：看到“起源于哪里”这类事实题，课件里的国家或人名往往就是答案。选项里没有它时，就选 None of the above。（参考：P2-3）"}, {"n": 2, "q": "i4.0 encompasses a wide range of advanced technologies, such as:", "opts": {"A": "Digital twins and artificial intelligence", "B": "High-speed wireless/wired networks", "C": "Cloud computing and virtualization", "D": "All of the above"}, "ans": "D", "ex": "**选 D。** 课件 P2-3 列出工业 4.0 涵盖的技术：数字孪生、人工智能、高速有线/无线网络、云计算和虚拟化。A、B、C 各列了其中一部分，都对，所以选 All of the above。\n\n**技巧**：几个选项都是课件里列过的内容，且互不矛盾时，通常选“全部”。（参考：P2-3）"}, {"n": 3, "q": "IoT are driving force for industry 4.0, however __________ .", "opts": {"A": "Currently they are only being used in smart homes", "B": "They are vulnerable to cyber security attacks", "C": "They will only be popular in 2030, which might be too late", "D": "None of the above"}, "ans": "B", "ex": "**选 B。** 物联网（IoT）是工业 4.0 的驱动力，**但它们容易遭受网络攻击**，这正是这一讲的主线：技术越互联，安全风险越大。\n\nA 说“只用在智能家居”太窄，IoT 还用在智能工厂等；C“2030 年才流行”与事实不符。\n\n**联系前一讲**：第 1 讲里的 Mirai 就是利用 IoT 设备（摄像头、打印机）组成僵尸网络发动 DDoS。（参考：P2-18、P2-23、P2-26）"}, {"n": 4, "q": "Choose the correct statement about Digital Twins.", "opts": {"A": "It is a virtual representation or digital replica (copy) of assets, people, processes, systems, devices, and places", "B": "Companies utilize digital twin technology to develop virtual prototypes of new products and get insights", "C": "Both a and b", "D": "None of the above"}, "ans": "C", "ex": "**选 C（A 和 B 都对）。**\n- A：数字孪生是资产、人、流程、系统、设备和场所的**虚拟复制品**。\n- B：企业用它来做新产品的**虚拟原型**并获得洞察。\n\n**记法**：Digital twin = 现实对象的数字影子，可以在虚拟世界里测试，不影响真实设备。（参考：P2-18）"}, {"n": 5, "q": "The concept of Industry 4.0 depends upon connectivity, however, this interconnectivity creates cyber security holes.", "opts": {"A": "True", "B": "False"}, "ans": "A", "ex": "**选 True。** 工业 4.0 依赖**互联互通**，而互联带来了**安全漏洞**：连接的设备越多，攻击面越大。\n\n**考试写法**：连接性是好处，也是风险来源，二者是同一枚硬币的两面。（参考：P2-26）"}, {"n": 6, "q": "Cloud computing is one of the driving forces for industry 4.0 however using DDoS attack, its availability can be compromised. The other attacks can result in __________ of the stored data.", "opts": {"A": "Confidentiality", "B": "Integrity", "C": "Both a and b", "D": "None of the above"}, "ans": "C", "ex": "**选 C（机密性和完整性都会被破坏）。** 云计算的可用性可以被 DDoS 攻击破坏；**其他攻击**则可能破坏存储数据的**机密性**（被偷看）和**完整性**（被篡改）。\n\n**对应第 1 讲的 CIA**：DDoS → A；数据泄露 → C；数据被改 → I。题目问“其他攻击”，所以是 C + I。（参考：P2-8）"}, {"n": 7, "q": "The main reason for cyber security compromises is employee behavior which can be__________.", "opts": {"A": "Malicious", "B": "Unintentional", "C": "Both a and b", "D": "None of the above"}, "ans": "C", "ex": "**选 C（恶意和无意都有）。** 课件 P2-31 说：员工行为是导致安全问题的关键原因，既可能是**恶意**的（如心怀不满），也可能是**无意**的（如点了钓鱼链接）。\n\n**记法**：内部威胁不一定是坏人，**疏忽**同样会造成损失。（参考：P2-31）"}, {"n": 8, "q": "The principal problems associated with employee behavior in cyber security includes __________.", "opts": {"A": "Errors and omissions", "B": "Fraud", "C": "Actions by disgruntled employees", "D": "All of the above"}, "ans": "D", "ex": "**选 D（全部）。** 员工行为造成的三类主要问题：**错误与疏忽（errors and omissions）、欺诈（fraud）、心怀不满员工的行为（disgruntled employees）**。\n\n**记法**：错、骗、怨。（参考：P2-31）"}, {"n": 9, "q": "Choose the correct statement about cyber security awareness, training and education.", "opts": {"A": "Can serve as a deterrent to fraud and actions by disgruntled employees, by increasing employee’s knowledge of their accountability and of potential penalties", "B": "Employees cannot be asked to attend cyber security awareness program as this will make them liable", "C": "Both a and b", "D": "None of the above"}, "ans": "A", "ex": "**选 A。** 安全意识、培训和教育能**威慑欺诈和心怀不满者的行为**，因为让员工知道自己的责任和可能的处罚。\n\nB 错：员工**可以**被要求参加，而且不能指望员工遵守他们不知道的规定。C 包含 B，所以也错。\n\n**要点**：培训还有助于限制组织的责任（liability），以及满足法规和合同要求。（参考：P2-32）"}, {"n": 10, "q": "Cyber security awareness policy should include.", "opts": {"A": "Participation is required for every employee", "B": "Everyone will be given sufficient time to participate", "C": "Both a and b", "D": "None of the above"}, "ans": "C", "ex": "**选 C（A 和 B 都对）。** 课件 P2-33 的安全意识政策要求：①**每位员工都必须参加**；②**每个人都有足够的时间参加**；③责任划分清晰；还包括新员工入职培训和定期活动。\n\n**记法**：必须参加 + 给时间。（参考：P2-33）"}, {"n": 11, "q": "Cyber security training teaches what people should do and how they should do it.", "opts": {"A": "True", "B": "False"}, "ans": "A", "ex": "**选 True。** Training（培训）教人**“该做什么”以及“怎么做”**，目的是让人更安全地完成 IT 相关任务。\n\n**三者区别**（常考）：\n- **Awareness 意识**：让人知道有风险。\n- **Training 培训**：教具体技能，该做什么、怎么做。\n- **Education 教育**：更深的专业知识。（参考：P2-34）"}, {"n": 12, "q": "Choose the correct social engineering examples.", "opts": {"A": "Phone Call: This is John, the System Administrator. What is your password?", "B": "Email: ABC Bank has noticed a problem with your account, click on the link below and provide the password to resolve it", "C": "Both a and b", "D": "None of the above"}, "ans": "C", "ex": "**选 C（A 和 B 都是）。**\n- A：电话里冒充系统管理员问密码，是社会工程（vishing 的典型）。\n- B：冒充银行发邮件，让你点链接提供密码，是网络钓鱼。\n\n**共同点**：都是利用**人的信任**，而不是技术漏洞。（参考：P2-37）"}, {"n": 13, "q": "Spear phishing scam is when they target you specifically. They have researched you, they know your family members, where you work, and who is your boss. The chances of fooling you are higher.", "opts": {"A": "True.", "B": "False"}, "ans": "A", "ex": "**选 True。** 鱼叉式钓鱼（spear phishing）针对**特定的人**，攻击者做过调查，了解你的家人、工作、上司，所以更容易骗到你。\n\n**对比**：普通钓鱼是群发，鱼叉式是精准针对，捕鲸（whaling）则专门针对高管。（参考：P2-40）"}, {"n": 14, "q": "Some of the top search results in Google are phishing links.", "opts": {"A": "True", "B": "False"}, "ans": "A", "ex": "**选 True。** 课件提醒：Google 搜索结果的前几位里也可能有钓鱼链接，所以**不能因为搜索排名靠前就认为安全**。（参考：P2-40~42）"}, {"n": 15, "q": "Social media is full of fake accounts and scammers make it look like it is your real friend.", "opts": {"A": "True", "B": "False"}, "ans": "A", "ex": "**选 True。** 社交媒体上有大量**假账号**，骗子会让它看起来像你的真朋友，以此获取信任。\n\n**联系第 1 讲 Q&A**：社会工程师靠挖掘社交网络信息来建立信任。（参考：P2-42~44）"}, {"n": 16, "q": "In vishing attack, which is made over the telephone, scammers can spoof a phone number that looks identical to a known number, like your bank.", "opts": {"A": "True", "B": "False"}, "ans": "A", "ex": "**选 True。** Vishing（电话钓鱼）里，骗子可以**伪造来电号码**，显示得和你银行的号码一模一样。\n\n**教训**：不要因为来电显示是银行就相信对方，应该挂掉后用官方号码回拨。（参考：P2-45）"}, {"n": 17, "q": "Choose the correct statement about cyber security compliance.", "opts": {"A": "It means following standards and regulatory requirements set by some agency, law or authority group.", "B": "It means make cyber security challenging both for attackers and users", "C": "Both a and b", "D": "None of the above"}, "ans": "A", "ex": "**选 A。** 合规（compliance）指**遵守某个机构、法律或权威组织规定的标准和法规要求**。\n\nB 错：合规的目标是**保护组织**，不是故意让攻击者和用户都更难。C 包含 B，所以也错。（参考：P2-51）"}, {"n": 18, "q": "Some benefits of Cybersecurity Compliance include:", "opts": {"A": "Helps identify, interpret and prepare for potential data breaches", "B": "Improves an organization’s security position", "C": "Builds customer confidence and loyalty", "D": "All of the above"}, "ans": "D", "ex": "**选 D（全部）。** 合规的好处：帮助识别、解释和准备应对数据泄露；改善组织的安全状况；建立客户信心和忠诚度。此外还能保护声誉、维持客户信任、保护知识产权。（参考：P2-52）"}, {"n": 19, "q": "Forming a compliance team is necessary when implementing a thorough compliance program.", "opts": {"A": "True", "B": "False"}, "ans": "A", "ex": "**选 True。** 课件的合规计划五步里，第一步就是**组建合规团队**：组织的 IT 团队是合规的主要力量，要实施全面的合规计划，必须成立合规团队。\n\n**五步顺序**：①组建团队 → ②风险分析 → ③设置控制措施 → ④制定政策 → ⑤持续监测。（参考：P2-53）"}, {"n": 20, "q": "Cyber security controls can be technical controls (passwords), or physical (camera and fences).", "opts": {"A": "True", "B": "False"}, "ans": "A", "ex": "**选 True。** 网络安全控制措施分为：**技术控制**（如密码、访问控制列表）和**物理控制**（如监控摄像头、围栏）。\n\n**课件列举的控制**：加密、防火墙、密码策略、网络保险、员工培训、事件响应计划、访问控制、补丁管理计划。（参考：P2-54）"}], "3": [{"n": 1, "q": "In developing a cyber security plan, what should a company/organization do first (particularly when they are in the initial planning stages)?", "opts": {"A": "It should buy state of the art technology", "B": "It must first assess the current state of its security", "C": "Both a and b", "D": "None of the above"}, "ans": "B"}, {"n": 2, "q": "Is top management support important in the success of cyber security project, when the project is being planned, implemented and executed?", "opts": {"A": "Yes, only at the initial stage", "B": "Yes, throughout the project stages", "C": "No", "D": "None of the above"}, "ans": "B"}, {"n": 3, "q": "What must top management do to demonstrate support for cyber security project?", "opts": {"A": "Must ensure an adequate budget and follows security procedures themselves", "B": "Send email to all staff and inform them that they are supporting the project", "C": "Management cannot do anything as it is managed by technical staff", "D": "None of the above"}, "ans": "A"}, {"n": 4, "q": "What are policies?", "opts": {"A": "Policies are statements about what should be done under specific circumstances", "B": "Policies describe the actions that are taken to place the policy guidance into operation", "C": "Both a and b", "D": "None of the above"}, "ans": "A"}, {"n": 5, "q": "Why policies need to be acceptable to users?", "opts": {"A": "If policies are not acceptable (sensible) then users will bypass it, which is a dangerous trend", "B": "So that users can modify it according to his/her needs", "C": "Both a and b", "D": "None of the above"}, "ans": "A"}, {"n": 6, "q": "Distinguish between standards and guidelines.", "opts": {"A": "Standards are mandatory while guidelines are discretionary", "B": "Standards must be followed, while guidelines can be completely ignored", "C": "Standard can be optional while guidelines are fixed", "D": "None of the above"}, "ans": "A"}, {"n": 7, "q": "For guidelines, what is mandatory?", "opts": {"A": "It is mandatory for decision makers to carefully consider guidelines", "B": "Nothing is mandatory for guidelines", "C": "Since guidelines are must, everything is mandatory in guidelines", "D": "None of the above"}, "ans": "A"}, {"n": 8, "q": "Which of the following is not an authentication factor?", "opts": {"A": "Something you have", "B": "Something you know", "C": "Something you see", "D": "Something you are"}, "ans": "C"}, {"n": 9, "q": "________ is the process of assessing the identity of each individual claiming to have permission to use a resource.", "opts": {"A": "Authorizations", "B": "Authentication", "C": "Availability", "D": "None of the above"}, "ans": "B"}, {"n": 10, "q": "Short and simple reusable passwords are always easy for hackers to crack?", "opts": {"A": "Yes: As it can be cracked or guessed easily", "B": "No: Regardless whether it is simple or complex, no password can be easily cracked", "C": "It will still take very long time as no password is easy to crack", "D": "None of the above"}, "ans": "A"}, {"n": 11, "q": "Using biometric technology can enhance customer trust?", "opts": {"A": "Yes: In fact, it does enhance customer trust and combat fraud", "B": "No: Trust is not related to biometric based technology", "C": "Trust can only be enhanced using complex system", "D": "None of the above"}, "ans": "A"}, {"n": 12, "q": "What is the most common type of biometrics device in use today?", "opts": {"A": "Lie detectors that measure pulse rate", "B": "Fingerprint scanners and readers", "C": "Retinal scanners", "D": "None of the above"}, "ans": "B"}, {"n": 13, "q": "A false acceptance occurs when a person is improperly matched to a template?", "opts": {"A": "Yes", "B": "No"}, "ans": "A"}, {"n": 14, "q": "When an attacker deliberately attempts to fool the system, this is called ________.", "opts": {"A": "deception", "B": "false acceptance", "C": "false rejection", "D": "None of the above"}, "ans": "A"}, {"n": 15, "q": "Which of the following statements accurately describes fingerprint recognition?", "opts": {"A": "Fingerprint recognition scanners are very expensive", "B": "Fingerprint recognition is easily deceived", "C": "Fingerprint recognition is rarely used", "D": "None of the above"}, "ans": "B", "ex": "**选 B。** 课件 P3-23/P3-28 讲指纹识别的局限：**Spoofing（欺骗）**——用明胶（gelatin）等材料做的假指纹就能骗过传感器，所以说它“容易被欺骗”。\n\nA 错：指纹扫描器很便宜，手机、门禁、考勤机都在用。C 错：它恰恰是**最常用**的生物识别（Touch ID、银行 App、身份证）。\n\n**知识点**：生物识别的缺点四件套——隐私、**可被伪造（spoofing）**、**不可更换**（指纹泄露了没法像密码一样改）、受伤/生病影响识别。（参考：P3-23、P3-28）"}], "4": [{"n": 1, "q": "The process of converting from plaintext to cipher text is known as deciphering or decryption.", "opts": {"A": "Yes", "B": "No"}, "ans": "B"}, {"n": 2, "q": "If both sender and receiver use the same key to encrypt and decrypt, the system is referred to as:", "opts": {"A": "Public-key crypto system", "B": "Asymmetric key crypto system", "C": "Symmetric key crypto system", "D": "None of the above"}, "ans": "C"}, {"n": 3, "q": "When message is divided into blocks (e.g., sets of 8- or 16-bit blocks) and each is transformed into encrypted block of cipher using algorithm and key it is called", "opts": {"A": "Block Cipher", "B": "Bit Stream Cipher", "C": "Both a and b", "D": "None of the above"}, "ans": "A"}, {"n": 4, "q": "Which of the following is a symmetric crypto system using 64-bit blocks?", "opts": {"A": "RSA", "B": "DES", "C": "PGP", "D": "None of the above"}, "ans": "B"}, {"n": 5, "q": "What size key does a DES system use?", "opts": {"A": "64 bit", "B": "128 bit", "C": "56 bit", "D": "256 bit"}, "ans": "C"}, {"n": 6, "q": "What is data encryption standard (DES)?", "opts": {"A": "Block cipher", "B": "Stream cipher", "C": "Bit cipher", "D": "None of the above"}, "ans": "A"}, {"n": 7, "q": "Which is the largest disadvantage of the symmetric Encryption?", "opts": {"A": "More complex and therefore more time-consuming calculations", "B": "Problem of the secure transmission of the Secret Key", "C": "Less secure encryption function", "D": "Isn't used any more"}, "ans": "B"}, {"n": 8, "q": "What you should be most careful of when looking for an encryption method to use?", "opts": {"A": "Complexity of the algorithm", "B": "Veracity of the vendor’s claims", "C": "Speed of the algorithm", "D": "How long the algorithm has been around"}, "ans": "D"}, {"n": 9, "q": "Which of the following is most likely to be true of an encryption method that is advertised as unbreakable?", "opts": {"A": "It is probably suitable for military use.", "B": "It may be too expensive for your organization.", "C": "It is likely to be exaggerated.", "D": "It is probably one you want to use."}, "ans": "C"}, {"n": 10, "q": "Which of the following is most true regarding certified encryption methods?", "opts": {"A": "These are the only methods you should use.", "B": "It depends on the level of certification.", "C": "It depends on the source of the certification.", "D": "There is no such thing as certified encryption."}, "ans": "D"}, {"n": 11, "q": "Which of the following is most true regarding new encryption methods?", "opts": {"A": "Never use them until they have been proven.", "B": "You can use them, but you must be cautious.", "C": "Only use them if they are certified.", "D": "Only use them if they are rated unbreakable."}, "ans": "B"}, {"n": 12, "q": "Asymmetric encryption utilizes only a public key for encryption and decryption.", "opts": {"A": "True", "B": "False"}, "ans": "B"}, {"n": 13, "q": "Asymmetric encryption can be used for confidentiality but not for authentication.", "opts": {"A": "True", "B": "False"}, "ans": "B"}, {"n": 14, "q": "Public-key encryption is more secure than symmetric encryption as it uses two keys.", "opts": {"A": "True", "B": "False"}, "ans": "B"}, {"n": 15, "q": "The most widely used public-key cryptosystem is __________ .", "opts": {"A": "RSA", "B": "DES", "C": "3DES", "D": "None of the above"}, "ans": "A", "ex": "**选 A。** RSA 是**使用最广泛的公钥（非对称）密码体制**，安全性来自“大数分解很难”。\n\nB、C 错：DES 和 3DES 是**对称**加密（加密解密用同一把钥匙），根本不是公钥体制，一眼排除。\n\n**知识点**：公钥算法记 4 个——Diffie-Hellman（只做密钥交换）、El-Gamal、**RSA**、ECC。对称算法：DES、3DES、AES。（参考：P4-67）"}, {"n": 16, "q": "The Diffie-Hellman algorithm depends on the difficulty of computing discrete logarithms for its effectiveness.", "opts": {"A": "True", "B": "False"}, "ans": "A"}, {"n": 17, "q": "Most of the products and standards that use public-key cryptography for encryption and digital signatures use RSA.", "opts": {"A": "True", "B": "False"}, "ans": "A"}, {"n": 18, "q": "Suppose that you are using the RSA algorithm and have chosen two prime numbers, p = 5 and q = 11. What will be value of Phi", "opts": {"A": "55", "B": "13", "C": "14", "D": "None of the above"}, "ans": "D", "ex": "**选 D。** RSA 中 **φ(n) = (p−1)(q−1)** = (5−1)(11−1) = 4 × 10 = **40**，选项里没有 40，所以选 None of the above。\n\n陷阱：A 的 55 是 **n = p × q**，不是 φ。13、14 是凑数的。\n\n**RSA 步骤速记**：① 选素数 p、q ② n = p·q ③ φ = (p−1)(q−1) ④ 选 e，与 φ 互素 ⑤ 求 d，使 e·d ≡ 1 (mod φ)。公钥 (e, n)，私钥 (d, n)。（参考：P4-67 起）"}, {"n": 19, "q": "In RSA algorithm, if the two prime numbers are, 5 and 11 then what will be value of Modulus, N", "opts": {"A": "55", "B": "44", "C": "20", "D": "None of the above"}, "ans": "A"}, {"n": 20, "q": "Given two very large prime numbers p and q, a composite number N (Modulus) can be calculated as N = p* q. However, given just N, it is not feasible for hackers to find p and q.", "opts": {"A": "Yes, that is true", "B": "No, that is not true at all", "C": "It may be possible in some cases", "D": "None of the above"}, "ans": "A", "ex": "**选 A。** 已知两个大素数 p、q，算 N = p × q 很容易；但只给 N，想反推出 p 和 q（**大数分解**）在计算上不可行。这正是 **RSA 安全性的来源**。\n\nC 容易误选：理论上数小时能分解，但题目说的是 very large primes，实际中不可行，所以答“对”。\n\n**知识点**：RSA 的安全 = 大数分解难题（factoring problem）。乘起来容易，拆开难——这叫“单向陷门函数”。（参考：P4-67）"}, {"n": 21, "q": "In public key cryptosystem when Carol sends a message to Bob for confidentiality, what key will she use to encrypt the message?", "opts": {"A": "Public Key", "B": "Bob’s Public Key", "C": "Carols’ Private Key", "D": "None of the above."}, "ans": "B", "ex": "**选 B。** 要保密（confidentiality），就用**收件人的公钥**加密：Carol 用 **Bob 的公钥**加密，只有拥有 **Bob 私钥**的 Bob 能解开。\n\nA 太含糊（谁的公钥？）。C 错：用 Carol 自己的私钥加密是**数字签名**（证明是 Carol 发的），任何人都能用她的公钥解开，起不到保密作用。\n\n**口诀**：**保密用对方公钥，签名用自己私钥。**（参考：P4 公钥加密部分）"}, {"n": 22, "q": "In public key cryptosystem when Carol sends an encrypted message to Bob for confidentiality, what key will Bob use to decrypt the message?", "opts": {"A": "Bob’s Private Key", "B": "Bob’s Public Key", "C": "Carols’ Private Key", "D": "Carol’s Public Key"}, "ans": "A"}, {"n": 23, "q": "In a classroom with 30 students and a professor, how many public and private keys will be used if all students want to submit the encrypted assignment to the professor?", "opts": {"A": "30 public and 30 private", "B": "1 public and 30 private", "C": "1 public and 1 private", "D": "Variable keys depending on the application"}, "ans": "D"}, {"n": 24, "q": "In asymmetric cryptography system for confidential communication, the private key is used by ---- --------------- to decrypt ciphertext", "opts": {"A": "Sender", "B": "Receiver", "C": "Sender and receiver", "D": "All the connected devices on the network"}, "ans": "B"}, {"n": 25, "q": "A __________ is a digital document issued and digitally signed by Certification Authority that binds the name of a subscriber to a public key.", "opts": {"A": "Digital certificate", "B": "Digital signature", "C": "Both a and b", "D": "None of the above"}, "ans": "A"}, {"n": 26, "q": "The principal object of a hash function is __________ .", "opts": {"A": "Data integrity", "B": "Authentication", "C": "Both a and b", "D": "None of the above"}, "ans": "A", "ex": "**选 A。** 哈希函数的主要目的是保证**数据完整性（integrity）**：数据哪怕改一个比特，哈希值就完全不同，一比对就知道有没有被篡改。\n\nB 错：哈希本身**没有密钥**，谁都能算，所以单靠哈希不能证明“是谁发的”（认证）。要认证得配合私钥签名（数字签名）或密钥（HMAC）。\n\n**知识点**：哈希 = 单向、定长输出、任何改动都会改变结果；常见算法 SHA 系列、MD5。（参考：P4-109）"}, {"n": 27, "q": "The most important and widely used family of cryptographic hash functions is the __________ family", "opts": {"A": "Secure Hash Algorithm (SHA)", "B": "Digest", "C": "Hash Value", "D": "All of the above"}, "ans": "A"}, {"n": 28, "q": "The hash value of a message in __________ application is encrypted with a sender's private key.", "opts": {"A": "Digital signature", "B": "Digital certificate", "C": "Secure Hash Algorithm (SHA)", "D": "None of the above"}, "ans": "A", "ex": "**选 A。** **数字签名**的做法：先对消息算哈希，再用**发送者的私钥**加密这个哈希值，得到签名。接收方用发送者的公钥解开，再和自己算的哈希比对。\n\nB 错：数字证书是 CA 用来证明“某个公钥属于某人”的文件。C 错：SHA 只是一个哈希算法，不涉及私钥。\n\n**知识点**：数字签名 = 哈希 + 发送者私钥 → 同时提供完整性、认证和不可否认（non-repudiation）。（参考：P4-105）"}, {"n": 29, "q": "A digital signature can guarantee", "opts": {"A": "The integrity of the message", "B": "The source of the message", "C": "Both a and b", "D": "None of the above"}, "ans": "C"}, {"n": 30, "q": "When a message and a digital signature (signed hash) are received, a new hash is created from the received message and compared to the original hash in the digital signature. The message has not been altered when the hash values are:", "opts": {"A": "Not equal", "B": "Equal", "C": "It doesn’t matter", "D": "None of the above"}, "ans": "B"}, {"n": 31, "q": "Digital signatures are created using a public key crypto system. Which key does a sender use when they wish to digitally sign a hash before it is sent?", "opts": {"A": "Senders public key", "B": "Senders private key", "C": "Both a and b", "D": "None of the above"}, "ans": "B"}, {"n": 32, "q": "The purpose of a digital certificate is to -------", "opts": {"A": "Authenticate the public key", "B": "Authenticate the private key", "C": "Both a and b", "D": "None of the above"}, "ans": "A", "ex": "**选 A。** 数字证书由 CA（证书颁发机构）签发，作用是**证明某个公钥确实属于某人**，即认证公钥。\n\nB、C 错：私钥自己保管，**从不公开**，也不会放进证书里，所以谈不上“认证私钥”。\n\n**知识点**：证书里有：持有者身份、**持有者的公钥**、有效期、CA 的签名。验证时用 CA 的公钥验签，在有效期内才有效。（参考：P4-119 起）"}, {"n": 33, "q": "A special mathematical function that performs one-way encryption is called", "opts": {"A": "Asymmetric encryption", "B": "Transposition cipher", "C": "Hashing", "D": "Multiple encryption"}, "ans": "C"}, {"n": 34, "q": "Hybrid system uses public key cryptography for", "opts": {"A": "Encryption", "B": "Key exchange", "C": "Both a and b", "D": "None of the above"}, "ans": "B", "ex": "**选 B。** 混合系统（hybrid system）取两者之长：**公钥加密只用来交换密钥**（安全地把对称会话密钥传过去），**真正的数据用对称加密**（因为对称加密快得多）。\n\nA、C 错：公钥加密太慢，不拿来加密大量数据。\n\n**知识点**：对称——快，但密钥难分发；非对称——密钥分发方便，但慢。混合 = 非对称送钥匙 + 对称加密数据，SSL/TLS 就是这样做的。（参考：P4-98~100）"}, {"n": 35, "q": "In hybrid system ------- crypto system is used to encrypt the session data", "opts": {"A": "Symmetric", "B": "Asymmetric", "C": "Both a and B", "D": "None of the above"}, "ans": "A"}], "5": [{"n": 1, "q": "The most complex part of TLS is the __________.", "opts": {"A": "signature", "B": "message header", "C": "payload", "D": "handshake protocol"}, "ans": "D"}, {"n": 2, "q": "_______ is a list that contains the combinations of cryptographic algorithms supported by the client", "opts": {"A": "Compression method", "B": "Session ID", "C": "Cipher Suite", "D": "All of the above"}, "ans": "C", "ex": "**选 C。** **Cipher Suite（密码套件）**是客户端支持的**密码算法组合列表**（比如：密钥交换算法 + 加密算法 + 哈希算法）。SSL/TLS 握手时，客户端在 Client Hello 里列出自己支持的 cipher suites，服务器从中选一个。\n\nA 错：Compression method 是压缩方法。B 错：Session ID 是会话编号。D 错：只有 C 对。\n\n**知识点**：握手第一步 Client Hello 带：版本、随机数、Session ID、**Cipher Suite 列表**、压缩方法。（参考：P5-17）"}, {"n": 3, "q": "The SSL record protocol provides two services for SSL/TLS connection: message integrity and _________", "opts": {"A": "Confidentiality", "B": "Availability", "C": "Authentication", "D": "None of the above"}, "ans": "A"}, {"n": 4, "q": "The _________ is used to convey SSL-related alerts to the peer entity", "opts": {"A": "alert protocol", "B": "digital signature", "C": "Digital certificate", "D": "None of the above"}, "ans": "A"}, {"n": 5, "q": "Most browsers come equipped with TLS/SSL and most Web servers have implemented the protocol", "opts": {"A": "TRUE", "B": "FALSE"}, "ans": "A"}, {"n": 6, "q": "The firewall may be a single computer system or a set of two or more systems that cooperate to perform the firewall function.", "opts": {"A": "TRUE", "B": "FALSE"}, "ans": "A"}, {"n": 7, "q": "A traditional packet filter makes filtering decisions on an individual packet basis and does not take into consideration any higher layer context", "opts": {"A": "TRUE", "B": "FALSE"}, "ans": "A"}, {"n": 8, "q": "The _________ is inserted between the premises network and the Internet to establish a controlled link and to erect an outer security wall or perimeter to protect the premises network from Internet-based attacks.", "opts": {"A": "Firewall", "B": "Session ID", "C": "IP protocol field", "D": "All of the above"}, "ans": "A"}, {"n": 9, "q": "A _________ applies a set of rules to each incoming and outgoing IP packet and then forwards or discards the packet.", "opts": {"A": "packet filtering firewall", "B": "IP protocol field", "C": "Both of the above", "D": "None of the above"}, "ans": "A", "ex": "**选 A。** **包过滤防火墙（packet filtering firewall）**对每个进出的 IP 包按规则检查（源/目的 IP、端口、协议），然后**放行或丢弃**。\n\nB 错：IP protocol field 只是 IP 包头里的一个字段，是过滤时检查的内容，不是“设备”。\n\n**知识点**：包过滤防火墙——成本低、对网络性能影响小，但只看包头、不看内容，安全性较弱。（参考：P5-57）"}, {"n": 10, "q": "An intruder transmitting packets from the outside with a source IP address field containing an address of an internal host is known as IP address _________.", "opts": {"A": "spoofing", "B": "authentication", "C": "generation", "D": "None of the above"}, "ans": "A"}, {"n": 11, "q": "A __________ firewall controls the traffic between a personal computer or workstation on one side and the Internet or enterprise network on the other side", "opts": {"A": "personnel", "B": "poxy server", "C": "application-level gateway", "D": "None of the above"}, "ans": "A", "ex": "**选 A。** 题目里 personnel 是 **personal** 的拼写错误。**个人防火墙（personal firewall，也叫桌面防火墙）**是装在单台电脑上的软件，控制这台电脑和互联网/企业网络之间的流量。\n\nB 错：代理服务器在网络之间做中转，不是保护单台电脑。C 错：应用层网关（application-level gateway）检查应用层内容，是网络级防火墙。\n\n**关键词**：看到 “a personal computer or workstation on one side” → 个人防火墙。（参考：P5-53）"}, {"n": 12, "q": "The firewall can protect against attacks that bypass the firewall", "opts": {"A": "TRUE", "B": "FALSE"}, "ans": "B"}, {"n": 13, "q": "Intrusion detection is based on the assumption that the behavior of the intruder differs from that of a legitimate user in ways that can be quantified.", "opts": {"A": "TRUE", "B": "FALSE"}, "ans": "A"}, {"n": 14, "q": "Signature-based approaches attempt to define normal, or expected behavior, whereas anomaly approaches attempt to define proper behavior", "opts": {"A": "TRUE", "B": "FALSE"}, "ans": "B", "ex": "**选 FALSE。** 这句话把概念**写反了/写混了**：\n• **Signature-based（特征检测）**：定义**已知攻击的特征**（“坏人长什么样”），匹配到就报警。\n• **Anomaly-based（异常检测）**：定义**正常行为的基线**（“正常是什么样”），偏离就报警。\n\n题目说“Signature 定义正常行为”是错的，所以选 FALSE。\n\n**口诀**：**特征查坏的，异常查不正常的。** 特征检测抓不到新攻击（漏报），异常检测容易误报。（参考：P5-87、P5-93）"}, {"n": 15, "q": "A _________ monitors the characteristics of a single host and the events occurring within that host for suspicious activity", "opts": {"A": "host-based IDS", "B": "security intrusion", "C": "network-based IDS", "D": "None of the above"}, "ans": "A", "ex": "**选 A。** **主机型 IDS（HIDS）**监控**单台主机**的特征和主机内发生的事件（日志、文件改动、进程等）。\n\nC 错：网络型 IDS（NIDS）监控的是**网段上的流量**，不是单台主机。B 错：security intrusion 指“入侵事件”本身，不是检测系统。\n\n**关键词**：single host → host-based；network segment/traffic → network-based。（参考：P5-87）"}, {"n": 16, "q": "A ________ monitors network traffic for particular network segments or devices and analyzes network, transport, and application protocols to identify suspicious activity", "opts": {"A": "host-based IDS", "B": "security intrusion", "C": "network-based IDS", "D": "None of the above"}, "ans": "C"}, {"n": 17, "q": "__________ involves an attempt to define a set of rules or attack patterns that can be used to decide if a given behaviour is that of an intruder.", "opts": {"A": "Profile based detection", "B": "Signature detection", "C": "Threshold detection", "D": "Anomaly detection"}, "ans": "D", "flag": "**注意**：官方红线标 D（Anomaly detection）。但题干说的是“一组规则或攻击模式”，一般对应 Signature detection（B），疑似标错。考试以老师为准。"}, {"n": 18, "q": "_________ involves the collection of data relating to the behavior of legitimate users over a period.", "opts": {"A": "Profile based detection", "B": "Signature detection", "C": "Threshold detection", "D": "Anomaly detection"}, "ans": "D", "ex": "**选 D。** **异常检测（anomaly detection）**的做法是：先**收集合法用户一段时间内的行为数据**，建立“正常”基线，再拿当前行为去比。\n\n容易误选 A/C：**阈值检测（threshold）**和**基于画像检测（profile-based）**是异常检测下面的**两种具体方法**，题目问的是这个总的概念。B 错：特征检测是比对已知攻击模式，不收集正常用户数据。\n\n**知识点**：Anomaly = 收集正常行为 → 建基线 → 偏离就报警，能发现新攻击但误报多。（参考：P5-93）"}]}, "chk": [{"no": 1, "mod": "模块 A", "level": "基础理解", "q": "用你自己的话说明机密性、完整性、可用性的区别，各给一个不同于讲义的例子。"}, {"no": 2, "mod": "模块 A", "level": "基础理解", "q": "未授权人员悄悄把转账金额从 100 改成 10000，破坏了 CIA 的哪一项？为什么不是机密性？"}, {"no": 3, "mod": "模块 A", "level": "基础理解", "q": "Authentication 和 Access Control 有什么区别？"}, {"no": 4, "mod": "模块 A", "level": "中等应用", "q": "判断下面事件主要破坏 CIA 的哪一项，并说明理由：(a) Ashley Madison 泄露 3700 万用户邮箱和住址；(b) 2016 年针对 Dyn 的 DDoS 使 Netflix、PayPal 无法访问；(c) 孟加拉央行的转账指令被伪造。"}, {"no": 5, "mod": "模块 A", "level": "中等应用", "q": "公司机房装了最先进的门禁（Products），但员工把工牌借给朋友进入。从 Products / People / Procedures 角度分析问题出在哪，应该如何补救？"}, {"no": 6, "mod": "模块 A", "level": "挑战", "q": "某勒索软件先复制公司客户数据，再加密所有文件，威胁“不付钱就公开数据”。它破坏了 CIA 的哪几项？每一项对应攻击的哪个动作？如果公司有离线备份，哪些风险仍然存在？"}, {"no": 7, "mod": "模块 B", "level": "基础理解", "q": "互联网有哪三个特征让网络攻击变得更容易？请用自己的话解释其中一个。"}, {"no": 8, "mod": "模块 B", "level": "基础理解", "q": "2024 年 CrowdStrike 事故主要破坏了 CIA 的哪一项？为什么它不算黑客攻击？"}, {"no": 9, "mod": "模块 B", "level": "中等应用", "q": "课件总结 2024 年哪三类弱点被反复利用？"}, {"no": 10, "mod": "模块 C", "level": "基础理解", "q": "病毒和蠕虫最本质的区别是什么？"}, {"no": 11, "mod": "模块 C", "level": "基础理解", "q": "Logic bomb 和普通病毒的区别是什么？举一个触发条件。"}, {"no": 12, "mod": "模块 C", "level": "中等应用", "q": "员工打开了一个“发票.pdf.exe”，电脑里装上了键盘记录器。这个更像哪种恶意软件？为什么？"}, {"no": 13, "mod": "模块 C", "level": "中等应用", "q": "判断对错：Rootkit 的主要目的是加密你的文件向你勒索。说明理由。"}, {"no": 14, "mod": "模块 C", "level": "挑战（取自 2025 年期末的论述题）", "q": "评估勒索软件的保护措施：写出一个有效的防护措施，以及这个措施的一个局限。"}, {"no": 15, "mod": "模块 D", "level": "基础理解", "q": "说明鱼叉式钓鱼和捕鲸攻击各自的目标。"}, {"no": 16, "mod": "模块 D", "level": "基础理解", "q": "暴力破解的成功取决于哪三个因素？"}, {"no": 17, "mod": "模块 D", "level": "中等应用", "q": "一个只含小写字母和数字（36 个字符）、长 8 位的密码，攻击者每秒尝试 10^9 次，穷举需要多久？"}, {"no": 18, "mod": "模块 D", "level": "中等应用", "q": "为什么账户锁定和限速能让暴力破解在线上基本失效，却防不了“离线哈希”破解？"}, {"no": 19, "mod": "模块 D", "level": "挑战（参考 2025 年期末 Q1(a)(ii)）", "q": "密码长度从 10 位增加到 12 位，字符集 95，速度不变。破解时间是增加还是减少？变化了多少倍？写出详细计算和理由。"}, {"no": 20, "mod": "模块 E", "level": "基础理解", "q": "DDoS 的三大类别是什么？各举一个例子。"}, {"no": 21, "mod": "模块 E", "level": "基础理解", "q": "用自己的话描述 SYN Flood 的 4 个步骤。"}, {"no": 22, "mod": "模块 E", "level": "基础理解", "q": "为什么早期攻击者要伪造 ping 洪水的源 IP 地址？"}, {"no": 23, "mod": "模块 E", "level": "中等应用", "q": "攻击者用 800 字节的 ICMP 包攻击一条 10 Mbps 链路，需要每秒多少个包？"}, {"no": 24, "mod": "模块 E", "level": "中等应用", "q": "MITM 和 DoS 分别主要破坏 CIA 的哪一项？为什么？"}, {"no": 25, "mod": "模块 E", "level": "挑战（参考 2024 年期末 Q3(b)(i)）", "q": "攻击者用 500 万台僵尸网络攻击一条 10 Gbps 链路，每个包 64K 字节（K=1024）。计算总共需要多少包/秒，以及平均每台每秒多少包。"}, {"no": 26, "mod": "模块 F", "level": "基础理解", "q": "白帽、黑帽、灰帽黑客的区别是什么？"}, {"no": 27, "mod": "模块 F", "level": "基础理解", "q": "Cryptojacking 是什么？受害者的唯一迹象是什么？"}, {"no": 28, "mod": "模块 F", "level": "中等应用", "q": "列出三项防御内部威胁的措施，并说明各自针对的问题。"}, {"no": 29, "mod": "模块 F", "level": "挑战（参考 Q&A 第 3 题）", "q": "解释为什么尽管技术和加密不断进步，仍然不可能为联网设备提供 100% 的安全。至少用上课件中的三个特征和一个攻击者动机。"}], "chkAns": {"1": "机密性：实习生不能翻看别人的病历；完整性：黑客把“青霉素过敏”改成“无”；可用性：急诊时系统被勒索软件锁死。判断方法：有人看了不该看的是 C；有人改了不该改的是 I；该用的人用不了是 A。", "2": "完整性。攻击的本质是篡改数据，而不是泄露数据；攻击者即使看到了金额，也不是这次攻击要达到的后果。", "3": "Authentication 回答“你是谁”（如密码、刷脸）；Access Control 回答“你能做什么”（如普通员工只能看自己的工资单）。先认证，再授权。", "4": "(a) C：邮箱和住址被未授权获取。(b) A：网站被流量压垮，合法用户用不了。(c) I：指令被伪造，内容不可信（同时涉及真实性）。", "5": "People：员工不遵守规定。Procedures：没有明确的“工牌不能外借”制度、处罚和检查。Products：只靠工牌是单一验证。补救：培训员工；制定并执行制度和处罚；加第二重验证（工牌 + 密码或指纹）并保留门禁日志。", "6": "破坏 C（复制数据）和 A（加密文件）。有离线备份后 A 可以恢复，但 C 仍然存在：数据已被复制，攻击者仍可公开。备份能防 A，防不了 C。", "7": "自动化、远距离作案、攻击手段易复制。例如“自动化”：脚本一秒能扫描成千上万个目标，攻击成本极低。", "8": "可用性（A）。它是软件厂商自己有错误的更新造成的，没有攻击者；说明故障和单点依赖也会破坏可用性。", "9": "勒索软件；云与供应链漏洞；内部人员/社会工程。", "10": "病毒需要宿主程序才能传播；蠕虫是独立完整的程序，不需要宿主。", "11": "逻辑炸弹在特定条件满足时才执行恶意动作，条件如愚人节、7 月 4 日、圣诞节；普通病毒的重点是自我复制传播。", "12": "木马：它伪装成发票文件，实际是恶意程序，并且装了键盘记录器。", "13": "错。Rootkit 的主要目的是获得控制权并隐藏自己，难以检测；加密勒索的是勒索软件。", "14": "示例：有效措施是离线备份（被加密后可恢复，不依赖付赎金）；局限：备份不能阻止数据被先偷走再威胁公开（C 仍被破坏），而且备份若没有隔离，也可能被一起加密。其他可答：杀毒、补丁、邮件过滤、员工培训等，每个都要写清局限（如对零日攻击无效、依赖人的行为）。", "15": "鱼叉式：针对特定个人或一小群人。捕鲸：针对高管和有高权限的关键人物。", "16": "密码长度、字符集大小、每秒尝试速度。", "17": "36^8 = 2.82×10^12；时间 = 2.82×10^12 ÷ 10^9 ≈ 2821 秒 ≈ 47 分钟。", "18": "线上登录有次数限制和锁定，攻击速度被压到很低；离线哈希已经被拿走，攻击者在自己机器上不受限，可以用最高速度尝试，所以要用强密码和加盐哈希。（盐的概念第 4 讲会补充。）", "19": "增加。组合数从 95^10 变成 95^12，是原来的 95^2 = 9025 倍；在相同速度下时间也变为 9025 倍。例如 126.6 年 × 9025 ≈ 1.14×10^6 年。", "20": "流量型（Ping/UDP flood）、协议型（SYN flood、Ping of Death）、应用层（HTTP flood）。", "21": "①攻击者向服务器大量发 SYN（常伪造源 IP）；②服务器回 SYN/ACK 并预留半开连接；③最终 ACK 永远不来，攻击者继续发更多 SYN；④资源耗尽，服务器无法正常服务。", "22": "因为源地址暴露后攻击者会被追责，而且目标会对源地址回复；伪造能隐藏身份并避免对方回复冲击自己。", "23": "10×10^6 ÷ (800×8) = 1562.5，约 1563 包/秒。", "24": "MITM：主要破坏 C（也会涉及 I），因为攻击者截获并可能篡改通信；DoS：破坏 A，因为合法用户无法使用服务。", "25": "总需求 = 10×10^9 ÷ (64×1024×8) ≈ 19,073 包/秒；平均每台 = 19,073 ÷ 5×10^6 ≈ 0.0038 包/秒。", "26": "白帽：授权的道德黑客，做渗透测试；黑帽：为偷钱或信用卡信息；灰帽：未授权利用漏洞，但目的是让所有者注意到弱点。", "27": "攻击者偷用别人的电脑挖加密货币；唯一迹象是运行变慢。", "28": "①安全文化与意识培训：针对疏忽；②按岗位限制访问权限：针对权限过大；③培训员工识别内部威胁：针对难以预测和恶意行为。", "29": "可答要点：自动化让攻击成本极低；攻击者可远距离作案且各国法律不同；攻击工具易复制和修改；攻击者动机多样（经济利益、政府支持、报复、公开性），新漏洞不断出现；而且安全是保护、易用性和可用性的平衡，增加保护就会牺牲便利。"}, "sa": [{"src": "Slides P8, Q&A Q1", "q": "Define cyber security and explain what CIA means.", "a": ["Cyber security is the collection of technologies, standards, policies and management practices applied to protect connected resources (hardware, software, data) from unauthorized **use, modification or theft**.", "**Confidentiality**: preventing unauthorized access or sharing of data. **Integrity**: data must not be changed by unauthorized people. **Availability**: information must be consistently and readily accessible to authorized parties, which requires properly maintained hardware, software and infrastructure.", "Security is achieved by a combination of **products, people and procedures**."]}, {"src": "Q&A Q3", "q": "Describe the various types of cyber security threats and explain why, despite advances in technology and encryption, 100% security cannot be provided for an Internet-connected device.", "a": ["**Types of attack:** criminal attacks (financial gain: fraud, theft), privacy violations (unauthorized collection of personal data) and publicity attacks (attackers seeking attention).", "**Why the Internet helps attackers:** (1) *automation* – the speed of computers makes low-return attacks profitable and data mining easy; (2) *action at a distance* – attackers can be far from the target, and differences in national laws hinder prosecution; (3) *electronic techniques are easily duplicated* – attack tools can be created by a single person and modified easily.", "**Conclusion:** security is a balance between protection, ease of use and availability. New vulnerabilities and attack methods appear continuously, so perfect security is impossible."]}, {"src": "Q&A Q2 (Morris worm)", "q": "A network virus copies itself to six neighbouring computers each time it lands on a computer, using a random file name each time. It does not read, delete or modify any files. What harm does it do and how can it be detected?", "a": ["This is really a **worm**. Each infected computer sends six copies to its neighbours, and they send copies back, so copies grow exponentially.", "**Harm:** disk space fills with copies, and bandwidth and CPU are used up until the computer crashes. It is effectively a **denial-of-service attack** (availability).", "**Detection:** look for unusual activity: a sudden surge in mail or network traffic, slow systems, unexpected growth in files; then investigate."]}, {"src": "Q&A Q4, Q10–12", "q": "Discuss how ransomware works and spreads. Why were organisations still hit by the second wave in June 2017, and how can they protect themselves?", "a": ["**How it works:** malicious software is installed on a device, usually when a victim clicks a link or opens an attachment. It encrypts files one after another and the victim is asked to pay a ransom, usually in cryptocurrency. Paying does not guarantee recovery.", "**Second wave:** many organisations had no security policies to respond, Microsoft had issued patches two months earlier but the systems were not updated, and users were untrained (about 83% of attacks start when an employee clicks a malicious link). So both **technical and non-technical** causes mattered.", "**Protection:** keep backups on a completely separate system, patch promptly, use antivirus and email filtering, train users against phishing, and have an incident response plan."]}, {"src": "2025 final exam Q1(b)", "q": "Critically discuss malware and its main types (viruses, worms, Trojans, ransomware and spyware). For each type, evaluate the protection techniques in use and their limitations.", "a": ["**Malware** is malicious software designed to damage, disrupt or steal. It has evolved from simple self-replicating viruses to adaptive code that evades signature-based detection.", "**Virus** (needs a host; spreads when infected files are run). *Protection:* antivirus, patching. *Limitation:* signature-based tools miss new or polymorphic variants.", "**Worm** (self-propagating, no host; can cause DoS-like load). *Protection:* patching, firewalls, network segmentation, traffic monitoring. *Limitation:* zero-day worms spread before patches exist.", "**Trojan** (disguised as legitimate software; opens backdoors or installs keyloggers). *Protection:* download only from trusted sources, application whitelisting, user training. *Limitation:* relies on user behaviour; social engineering still works.", "**Ransomware** (encrypts data and demands payment). *Protection:* offline backups, email filtering, patching, least privilege. *Limitation:* backups do not stop data theft and extortion, and paying does not guarantee recovery.", "**Spyware** (secretly steals confidential data). *Protection:* anti-spyware, firewalls, browser hardening. *Limitation:* stealthy variants and rootkits hide from detection.", "**Overall:** no single control is sufficient. Use layered defences (technology + people + procedures), regular updates and behaviour-based detection."]}, {"src": "Q&A Q13", "q": "Eve installed spyware on 1000 USB flash drives that auto-load along with photos of a famous star, painted a magazine logo on each and scattered them in company parking lots. What type of attack is this and what vulnerability is she exploiting?", "a": ["It is a **Trojan horse** attack: users expect photos of a famous star but also get spyware.", "She exploits **social engineering** (curiosity and trust in the logo) so that employees plug the drives into computers **inside the firewall**, and the vulnerability of **auto-execution** being enabled, which runs the spyware without the user’s knowledge. The firewall is bypassed because the code enters physically, not over the network."]}, {"src": "Q&A Q14", "q": "You suspect the computers in an Internet cafe contain keyloggers. Describe how to enter your user ID and password so that a keylogger used alone cannot discover them.", "a": ["Open the bank login page in the browser and a blank text editor. Click into the browser and type **one character** of the user ID or password, then click into the text editor and type a **random sequence** of characters; repeat.", "The keylogger records only a long stream of keystrokes in which the real characters are mixed with random ones, so it is hard to identify the credentials. (Mouse clicks are used to switch windows, so the order of windows is not recorded by the keylogger alone.)"]}, {"src": "Q&A Q15", "q": "What is the difference between a skilled and an unskilled hacker, and how does protection against each differ?", "a": ["A **skilled (expert) hacker** writes his or her own scripts and code, exploits little-known vulnerabilities and is expert in programming, protocols and operating systems. An **unskilled hacker (script kiddie)** uses tools written by others and rarely creates new attacks.", "Protection against experts is harder because they often use **new attack code (zero-day attacks)**. Protection against script kiddies relies on staying current with patches and knowing the published hacking tools."]}, {"src": "Q&A Q16–17", "q": "Why is it easy to get secret information such as passwords and credit card numbers through social engineering and social networks? Is using a neighbour’s unsecured Wi-Fi a risk?", "a": ["**Social networks:** people share messages, photos, locations and updates; the sites make money by collecting and selling data; most risks are old scams with new twists. Social engineers mine these networks to build **trust** and exert influence.", "**Unsecured Wi-Fi:** yes, it is risky. Login details and sensitive messages can be intercepted, other connected devices may be compromised, and the hotspot itself may be malicious (man-in-the-middle). Use a VPN or encrypted connections and avoid sensitive transactions."]}, {"src": "2024 final exam Q1(b)", "q": "Phishing is one of the most common social engineering attacks. (i) Explain spear phishing and whaling and their targets. (ii) Discuss technological measures to defend against phishing.", "a": ["**Phishing** uses deceptive emails, links or messages that appear legitimate to trick users into revealing sensitive information or installing malware.", "**Spear phishing** targets a **specific individual or group** with a personalised, convincing message (prepared after research). **Whaling** targets **senior executives and staff with high-level access**; junior staff are less likely to question requests that appear to come from executives (e.g. FACC lost $47 million).", "**Technical measures:** email filtering and spam/phishing detection, anti-phishing toolbars and URL reputation checks, **multi-factor authentication** so stolen passwords are not enough, up-to-date patches and endpoint protection, DNS filtering, email authentication (SPF, DKIM, DMARC), sandboxing of attachments; combined with regular staff training and simulated phishing exercises."]}, {"src": "2025 final exam Q1(a)", "q": "Discuss password-based authentication: strengths, weaknesses and defence strategies.", "a": ["**Strengths:** familiar, cheap, easy to deploy, works on any system, easy to reset.", "**Weaknesses:** users choose weak or reused passwords; vulnerable to guessing, dictionary and brute-force attacks, keyloggers, phishing, shoulder surfing and rainbow tables; breached databases enable credential stuffing (e.g. GitHub 2013).", "**Defences:** long, complex and unique passwords; account lockout; rate limiting; **MFA**; IP blacklisting; storing passwords as salted hashes; password managers; user training; monitoring for breached credentials."]}, {"src": "2024 final exam Q3(a)", "q": "Discuss the types of password attack and explain how MFA provides protection. Compare password-based with password-less authentication.", "a": ["**Brute force:** tries all combinations until the password is found. **Dictionary:** tries words from a list and common passwords. **Rainbow table:** uses precomputed hash tables to find the password from a stolen hash.", "**MFA** requires a second factor (something you have or are, in addition to something you know). Even if the password is guessed or stolen, the attacker lacks the second factor, so the attack fails.", "**Password-less** methods (biometrics, hardware keys, passkeys) remove the secret that can be guessed, phished or reused and improve usability. Limitations: biometric data cannot be changed if compromised, false accept/reject rates, privacy concerns and fallback mechanisms. Passwords alone are the weakest option; password-less or MFA is stronger."]}, {"src": "2023 final exam Q3(b)(i), slides P62–86", "q": "Explain DDoS and describe good practices to prevent it.", "a": ["A **denial-of-service (DoS)** attack floods a system, server or network with traffic to exhaust its resources or bandwidth so that legitimate requests cannot be served. It is a **DDoS** when many compromised systems (a botnet) launch the attack at the same time. It breaks **availability**.", "**Types:** volume-based (ICMP / UDP flood), protocol (SYN flood, Ping of Death), application-layer (HTTP GET/POST flood).", "**Prevention:** run traffic analysis to identify malicious traffic; recognise warning signs (slowdown, intermittent outages); prepare an incident response plan and checklist; rate limiting, firewall/ACL rules and ICMP filtering; IDS/IPS; outsource to cloud DDoS protection (Cloudflare, Akamai, AWS Shield)."]}, {"src": "2024 final exam Q3(b)(ii), slides P40–41, P78", "q": "IoT devices are widely used to build botnets for DDoS. Discuss why they are vulnerable and how devices are recruited and controlled.", "a": ["**Vulnerabilities:** default or hard-coded passwords, no or rare updates, weak security design, always on and exposed to the Internet, high-bandwidth connections, and users who never monitor them.", "**Recruitment:** malware such as **Mirai** scans the Internet for devices with default credentials or known flaws, logs in and installs itself; devices can also be infected through phishing, malicious downloads or infected drives.", "**Control:** infected devices (“zombies”) connect to a command-and-control server operated by the bot master, who sends instructions to attack one victim at the same time. The traffic comes from many places, so it is hard to trace and block (e.g. the 2016 Dyn attack)."]}, {"src": "Slides P71–74", "q": "Describe how a SYN flood attack works.", "a": ["In a normal TCP handshake the client sends SYN, the server replies SYN/ACK and the client sends ACK.", "In a SYN flood the attacker sends a high volume of SYN packets, often with **spoofed source addresses**. The server answers each one with SYN/ACK and keeps a half-open connection while waiting for the final ACK, which never arrives. New SYN packets keep arriving, so the connection table fills and the server cannot accept legitimate connections. It is a protocol-based DDoS attack against **availability**."]}, {"src": "Slides P65–67", "q": "Why did early ping-flood attackers spoof the source address, and what are the common defences against ping-based attacks?", "a": ["If the real address is used, the attacker is easily identified and legal action can be taken, and the target’s replies come back to the attacker. A **spoofed** address hides the attacker and avoids the reply traffic. Modern botnets rarely spoof; they rely on many un-spoofed bots.", "**Defences:** rate limiting ICMP replies, ICMP flood detection by firewalls, dropping ICMP from untrusted sources (ACLs), IDS (Snort, Suricata) and cloud DoS protection. Blocking ICMP entirely also disables legitimate ping."]}, {"src": "Slides P87–89", "q": "Explain insider threats and cryptojacking, and how to defend against each.", "a": ["**Insider threat:** an attack by someone inside the organisation (greed, malice or carelessness) who knows the systems; very hard to predict and potentially very damaging. *Defences:* a culture of security awareness, limit access to IT resources by job role (least privilege), and train employees to spot insider threats.", "**Cryptojacking:** attackers use someone else’s computer to mine cryptocurrency, via an infected website or malicious link; the only sign is slower performance. *Defences:* keep software updated, train staff, use an ad blocker and mining-script blockers such as MinerBlock."]}], "ca": [{"src": "Slides P55", "q": "A 6-digit numeric PIN (digits 0–9) is attacked by brute force at 500,000 guesses per second. How long does it take to try all combinations?", "a": ["Combinations = 10^6 = 1,000,000.", "Time = 1,000,000 ÷ 500,000 = **2 seconds**."]}, {"src": "Slides P56", "q": "A password has 10 characters chosen from the 95 printable ASCII characters. A cracker tests 6.4 × 10^6 passwords per second. How long will it take to test all possible passwords?", "a": ["Combinations = 95^10 ≈ 6.0 × 10^19.", "Time = 6.0 × 10^19 ÷ 6.4 × 10^6 ≈ 9.4 × 10^12 seconds.", "Years = 9.4 × 10^12 ÷ (3600 × 24 × 365) ≈ **3 × 10^5 years (about 300,000 years)**."]}, {"src": "2025 final exam Q1(a)", "q": "(a) Each user must choose a 10-character password from a 95-character keyboard set. Tom’s computer performs 15 billion (10^9) guesses per second. How long, in years, does an exhaustive search take? (b) Will the time increase or decrease if the length is increased from 10 to 12 characters? Show calculations. (c) Tom controls a botnet of 5 million computers, each performing 15 billion guesses per second; each user chooses a 12-character password. Calculate the time in years.", "a": ["(a) Combinations = 95^10 ≈ 5.99 × 10^19. Time = 5.99 × 10^19 ÷ 1.5 × 10^10 ≈ 3.99 × 10^9 s. Years = 3.99 × 10^9 ÷ 3.1536 × 10^7 ≈ **126.6 years**.", "(b) For 12 characters, combinations = 95^12 ≈ 5.40 × 10^23. Time = 5.40 × 10^23 ÷ 1.5 × 10^10 ≈ 3.60 × 10^13 s ≈ **1.14 × 10^6 years**. The time **increases** by a factor of 95^2 = 9025, because each extra character multiplies the search space by 95 (exponential growth).", "(c) Total rate = 5 × 10^6 × 1.5 × 10^10 = 7.5 × 10^16 guesses/s. Time = 5.40 × 10^23 ÷ 7.5 × 10^16 ≈ 7.2 × 10^6 s ≈ **0.228 years (about 83 days)**.", "*Comment:* even a large botnet can break a 12-character password in months, so length, MFA and rate limiting all matter."]}, {"src": "2024 final exam Q3(a)(i)", "q": "On a keyboard with 102 characters, the password length is 8. How long (in years) would it take to try all possible passwords at 8 billion (8 × 10^9) operations per second?", "a": ["Combinations = 102^8 ≈ 1.17 × 10^16.", "Time = 1.17 × 10^16 ÷ 8 × 10^9 ≈ 1.46 × 10^6 s.", "Years = 1.46 × 10^6 ÷ 3.1536 × 10^7 ≈ **0.046 years (about 17 days)**."]}, {"src": "2023 final exam Q3(a)(ii)", "q": "On a keyboard with 128 characters, the password length is 8. How long (in years) would it take to try all possible passwords at 8 million (8 × 10^6) operations per second?", "a": ["Combinations = 128^8 = 2^56 ≈ 7.21 × 10^16.", "Time = 7.21 × 10^16 ÷ 8 × 10^6 ≈ 9.0 × 10^9 s.", "Years = 9.0 × 10^9 ÷ 3.1536 × 10^7 ≈ **286 years**."]}, {"src": "Slides P68", "q": "An attacker sends ICMP Echo Request packets of 500 bytes to flood a target. How many packets per second are needed to fill (a) a 1.5 Mbps link, (b) a 10 Mbps link and (c) a 100 Mbps link?", "a": ["Packets per second = link speed ÷ (packet size × 8). Packet size in bits = 500 × 8 = 4000 bits.", "(a) 1,500,000 ÷ 4000 = **375 packets/s**.", "(b) 10,000,000 ÷ 4000 = **2,500 packets/s**.", "(c) 100,000,000 ÷ 4000 = **25,000 packets/s**.", "*Observation:* doubling the packet size halves the number of packets needed."]}, {"src": "2024 final exam Q3(b)(i)", "q": "An attacker uses a botnet of 5 million (5 × 10^6) computers to attack ABC company, whose link is 10 Gbps (1 G = 10^9). Each bot sends packets of 64K bytes (K = 1024). Calculate the number of packets that must be sent via the botnet.", "a": ["Packet size = 64 × 1024 = 65,536 bytes = 524,288 bits.", "Total packets per second = 10 × 10^9 ÷ 524,288 ≈ **19,073 packets/s** for the whole botnet.", "Per bot = 19,073 ÷ 5 × 10^6 ≈ **0.0038 packets/s**, i.e. about one packet every 262 seconds.", "*Comment:* with so many bots, each bot sends a negligible amount, which is why DDoS traffic is hard to spot and block at the source."]}, {"src": "2023 final exam Q3(b)(ii)–(iii)", "q": "A DoS attack is launched on an organisation with a 500 Megabits/second link. The attacker sends packets of 256K bytes. Calculate the number of packets the attacker must send. (Mega = 10^6, K = 1024.) How many packets are required if the packets are 512K bytes and the link is 5 Gigabits/second?", "a": ["(ii) Packet size = 256 × 1024 = 262,144 bytes = 2,097,152 bits. Packets/s = 500 × 10^6 ÷ 2,097,152 ≈ **238 packets/s**.", "(iii) Packet size = 512 × 1024 = 524,288 bytes = 4,194,304 bits. Packets/s = 5 × 10^9 ÷ 4,194,304 ≈ **1,192 packets/s**."]}], "plan": [["learn", "L1 A–B ✔", "浏览全部课件目录，说出 6 个模块名称（10 分钟）", "学：模块A–B（CIA、安全术语、威胁态势，P8–35）", "完成模块A检查题（6题）并批改", "每个 CIA 要素写 1 个自己的例子"], ["learn", "L1 C–D ✔", "回忆昨天：不看资料写 5 个关键词（10 分钟）", "学：恶意软件、钓鱼、密码攻击（P36–59）", "做恶意软件对照表：病毒/蠕虫/木马/勒索/间谍/Rootkit", "暴力破解时间计算 3 题"], ["learn", "L1–L2 已学完", "第 1、2 讲已学完（你自己完成的）。这一格直接打勾即可"], ["learn", "L3 已学完", "第 3 讲已学完（你自己完成的）。这一格直接打勾即可"], ["learn", "L4 已学完", "第 4 讲已学完（你自己完成的）。这一格直接打勾即可"], ["learn", "L5 TLS（学第 1 天）+ 复习 L1", "学第 5 讲 P5-3 ~ P5-39：HTTP/HTTPS、TLS 握手、TLS 1.3、SET（先看速记页第 5 讲）", "不看课件手画 TLS 握手流程", "【复习①】L1：不看资料默写框架（10 分钟）+ Sample Quiz Part 1 重做（20 分钟）+ DoS 包数计算 2 题（先写“字节 × 8”）（全天约 90 分钟）"], ["learn", "L5 防火墙与 IDS（学第 2 天）+ 复习 L2", "学第 5 讲 P5-40 ~ P5-97：防火墙类型与架构、IDS/IPS、蜜罐", "防火墙吞吐量计算 3 题（别漏 ×8）+ Sample Quiz Part 5（18 题，第 17 题疑似标错）", "【复习①】L2：默写要点（10 分钟）+ Sample Quiz Part 2 重做（15 分钟）+ 风险评分 3 题（全天约 90 分钟）"], ["review", "复习 L3、L5 + 模拟 #1", "【复习①】L3：默写要点 + FAR/FRR/CER 说清（15 分钟）+ Sample Quiz Part 3 重做", "【复习①】L5：手画 TLS 握手 + 吞吐量重算 1 题（15 分钟）", "刷题站“模拟测验 #1”（30 题限时），错题进错题本"], ["review", "复习 L4（概念）+ L1", "【复习①】L4 概念：对称/非对称、DES/AES、哈希、签名、证书，默写（20 分钟）+ Sample Quiz Part 4 前 15 题", "画出“签名与验证”流程图", "【复习②】L1：暴力破解与 DoS 各重算 1 题（15 分钟）"], ["review", "复习 L4（计算）+ L2、L5", "【复习①】L4 计算：Diffie-Hellman 手算 3 题、RSA 手算 3 题（含求 d），不看答案（40 分钟）+ Sample Quiz Part 4 后 20 题", "【复习②】L2（15 分钟）", "【复习②】L5（15 分钟）"], ["review", "轻松日（留给作业）", "【复习②】L3（15 分钟）", "重做错题本里的题", "其余时间做作业"], ["review", "缓冲日（留给作业）", "没有固定任务。作业优先", "有空时随机做 10 道选择题"], ["review", "复习 L1、L4 计算", "【复习③】L1：默写框架 + 暴力破解、DoS 各重算 1 题（15 分钟）", "【复习②】L4 计算：DH、RSA 各重做 2 题（30 分钟）", "重做错题本"], ["review", "复习 L2、L5 + 模拟 #2", "【复习③】L2（10 分钟）", "【复习③】L5：吞吐量重算 + TLS 握手默写（15 分钟）", "刷题站“模拟测验 #2”（30 题限时），分析错题"], ["review", "复习 L3（留给作业）", "【复习③】L3（10 分钟）", "重做 Part 3 错题", "其余时间做作业"], ["review", "错题本日（留给作业）", "只做错题本里的题", "默写公式：暴力破解、DoS 包数、风险、DH、RSA、吞吐量", "其余时间做作业"], ["review", "作业截止日", "先把作业交了", "只做 20 分钟：把速记页 5 讲的标题和公式看一遍"], ["review", "复习 L4（③）+ 模拟 #3", "【复习③】L4：DH、RSA 各重做 3 题，不看答案（30 分钟）", "刷题站“模拟测验 #3”（30 题限时）", "错题本过一遍"], ["review", "错题本 + 公式", "只做错题本里的题", "默写公式：暴力破解、DoS 包数、风险、DH、RSA、吞吐量", "速记页第 1–2 讲各看一遍"], ["review", "模拟 #4 + 速记", "刷题站“模拟测验 #4”（30 题限时）", "速记页第 3–5 讲各看一遍", "针对错题最多的一讲，重做对应 Part"], ["review", "弱点日", "针对错题最多的一讲，重看速记页 + 重做对应 Part", "把这一讲的公式或流程默写一遍"], ["sprint", "模拟 #5", "限时模拟测验 #5", "分析错题，只补最薄弱的 2–3 个点"], ["sprint", "轻量日", "速记页 5 讲各过一遍（每讲 10 分钟）", "错题本最后一遍", "早点休息"], ["sprint", "考试日", "上午只看速记页和公式", "带齐证件，提前到场", "考完回来开始区块链"]], "cheat": {"1": "\n<div class=\"card\"><h3>CIA 与术语</h3><table>\n<tr><th>要素</th><th>判断</th><th>例子</th></tr>\n<tr><td><b>C</b> 机密性</td><td>不该看的人<b>看到了</b></td><td>数据库泄露</td></tr>\n<tr><td><b>I</b> 完整性</td><td>不该改的人<b>改了</b></td><td>金额被篡改、指令被伪造</td></tr>\n<tr><td><b>A</b> 可用性</td><td>该用的人<b>用不了</b></td><td>DDoS、勒索软件、宕机</td></tr></table>\n<p>认证 Authentication = 你是谁；访问控制 Access control = 你能做什么；不可否认性 = 事后不能抵赖。勒索软件标准答案是 <b>A</b>，偷了数据再加 <b>C</b>；备份防得了 A，防不了 C。</p></div>\n<div class=\"card\" style=\"margin-top:12px\"><h3>恶意软件对照</h3><table>\n<tr><th>名称</th><th>最本质特征</th></tr>\n<tr><td>Virus 病毒</td><td>自我复制，<b>需要宿主</b></td></tr>\n<tr><td>Worm 蠕虫</td><td>自我复制，<b>不需要宿主</b></td></tr>\n<tr><td>Trojan 木马</td><td><b>伪装</b>成正常软件，不复制</td></tr>\n<tr><td>Logic bomb 逻辑炸弹</td><td>满足<b>条件</b>才触发</td></tr>\n<tr><td>Ransomware 勒索软件</td><td>加密文件要钱，付了也未必恢复</td></tr>\n<tr><td>Spyware 间谍软件</td><td>偷偷窃取机密信息</td></tr>\n<tr><td>Adware 广告软件</td><td>弹广告</td></tr>\n<tr><td>Rootkit</td><td>获得控制权并<b>隐藏自己</b></td></tr>\n<tr><td>Botnet 僵尸网络</td><td>被控制的电脑组成的网络（不是一种程序）</td></tr></table></div>\n<div class=\"card\" style=\"margin-top:12px\"><h3>钓鱼</h3><table>\n<tr><th>类型</th><th>目标</th></tr>\n<tr><td>Phishing</td><td>群发假邮件</td></tr>\n<tr><td>Spear phishing</td><td><b>特定个人或一小群人</b></td></tr>\n<tr><td>Whaling</td><td><b>高管</b>和高权限人员</td></tr>\n<tr><td>Smishing / Vishing / Angler</td><td>短信 / 电话 / 社交媒体</td></tr></table></div>\n<div class=\"card\" style=\"margin-top:12px\"><h3>两个必会公式</h3>\n<p><b>暴力破解</b>：组合数 = N<sup>L</sup>；时间（秒）= 组合数 ÷ 每秒次数；年 = 秒 ÷ (3600×24×365)；k 台并行 → 时间 ÷ k。</p>\n<p><b>DoS 包数</b>：包/秒 = 带宽(bit/s) ÷ (包字节数 × 8)。Mega = 10<sup>6</sup>，Giga = 10<sup>9</sup>；K = 1024 只用在字节上。</p>\n<p class=\"lab\">易错：漏 ×8；把 G 当成 2<sup>30</sup>；并行时乘了机器数。</p></div>\n<div class=\"card\" style=\"margin-top:12px\"><h3>DoS / DDoS</h3>\n<p>DoS 一个源，DDoS 很多个被控制的机器；破坏 <b>A</b>。三类：流量型（ping / UDP flood）、协议型（SYN flood、Ping of Death）、应用层（HTTP flood）。</p>\n<p>SYN flood：只发 SYN（常伪造 IP）→ 服务器回 SYN/ACK 并预留半开连接 → 最终 ACK 不来 → 资源耗尽。</p>\n<p>三个助攻特征：自动化、远距离作案、手段易复制。</p></div>\n<div class=\"card\" style=\"margin-top:12px\"><h3>攻击者与其他</h3>\n<p>白帽（授权）、黑帽（犯罪）、灰帽（未授权但通知所有者）、脚本小子、国家支持、黑客行动主义者。内部威胁防御：安全文化、最小权限、培训。Cryptojacking：偷用算力挖矿，迹象是变慢。</p></div>\n", "2": "<div class=\"card\" style=\"margin-top:0px\"><h3>工业革命与 i4.0/5.0（P2-3）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li>1.0 机械化和蒸汽；2.0 电力、流水线；3.0 计算机、自动化；<b>4.0</b> 智能技术（数字孪生、AI、高速网络、云、虚拟化）；<b>5.0</b> 人与 AI 机器人协作。</li><li>“工业 4.0”由世界经济论坛的 <b>Klaus Schwab</b> 在 2015 年底到 2016 年初于<b>德国</b>正式提出（课件说法）。</li><li>核心矛盾：<b>互联带来效率，也带来安全漏洞</b>（P2-26）。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>技术与对应风险（P2-6 ~ P2-26）</h3><table><tr><th>技术</th><th>要点</th><th>安全风险</th></tr><tr><td>IIoT 工业物联网</td><td>智能机器采集和传输数据；2024 年约 180 亿联网设备，2030 年约 321 亿</td><td>设备易被完全接管，可组成僵尸网络</td></tr><tr><td>Cloud 云计算</td><td>2006 年兴起，按需付费</td><td>最常见是针对<b>可用性</b>的 DoS，以及数据的<b>机密性和完整性</b></td></tr><tr><td>AI & Big Data</td><td>大数据是 AI 的燃料</td><td>网络犯罪上升约 400%，数据泄露是主要趋势</td></tr><tr><td>Digital twin 数字孪生</td><td>资产、人、流程、系统的虚拟副本；整合 IoT、分析、AI</td><td>洞察越多，被攻击者利用的入口越多</td></tr><tr><td>Virtualization</td><td>智能工厂的虚拟副本</td><td>主要挑战：物理资产与虚拟副本之间的<b>安全信息交换</b></td></tr><tr><td>CPS 信息物理系统</td><td>智能电网、自动驾驶、医疗监护、机器人、自动驾驶航电</td><td>最复杂的防护问题之一</td></tr><tr><td>Smart factory 智能工厂</td><td>2024 年 IIoT 市场超 7650 亿美元</td><td>制造业是第三大被攻击行业（仅次于金融和政府）；最大挑战是<b>数据可见性</b></td></tr></table></div><div class=\"card\" style=\"margin-top:12px\"><h3>人的因素（P2-31 ~ P2-34）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li>员工行为（恶意 + 无意）是安全损失的关键原因。三大问题：<b>错误与疏忽、欺诈、心怀不满员工的行为</b>。</li><li><b>Awareness 意识</b> → 让人知道有风险；<b>Training 培训</b> → 教<b>该做什么、怎么做</b>；<b>Education 教育</b> → 更深的专业知识。</li><li>培训对象：普通用户（良好安全习惯）、程序员/维护者（安全思维）、管理层（权衡风险、成本、收益）、高层（风险管理目标与领导）。</li><li>安全意识政策必须规定 3 件事：①<b>每位员工必须参加</b>（含新员工入职培训和定期活动）；②给<b>足够时间</b>；③<b>责任划分清晰</b>。</li><li>好处：威慑欺诈和报复，让员工知道自己的责任与处罚；限制组织责任（liability）；满足法规和合同要求。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>社会工程与防护（P2-37 ~ P2-49）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li>社会工程 = 操纵人去执行动作或泄露机密，靠欺骗而不是技术。形式：电话、邮件、当面。</li><li>常见骗局：<b>Email phishing</b>（冒充银行/老板）、<b>Spear phishing</b>（针对特定人，做过调查）、<b>Smishing</b>（短信）、<b>搜索引擎骗局</b>（置顶结果也可能是钓鱼）、<b>社交媒体</b>（假账号冒充朋友）、<b>QR 码</b>（贴纸覆盖真码）、<b>Vishing</b>（电话，可伪造来电号码）。</li><li>防钓鱼：紧急时别冲动；<b>回拨核实</b>；检查邮件地址和 URL 拼写；启用 MFA；看信息风格；多提问。</li><li>防勒索：别用公司邮箱密码做私人用途；不下载来路不明的文件；不把密码存在文本或表格里；小心带附件的钓鱼邮件。</li><li>USB 安全：加密 U 盘数据；避免公共充电站；不插不属于你的 USB。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>合规 Compliance（P2-51 ~ P2-59）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li><b>定义</b>：遵守旨在保护数据、系统和网络的法律、法规和标准。没有组织能完全免疫攻击；中小企业是“低垂的果实”。</li><li><b>好处</b>：保护声誉、维持客户信任、建立信心和忠诚、识别并准备应对数据泄露、改善安全状况、保护知识产权。</li><li><b>合规计划五步</b>：①组建合规团队 → ②风险分析 → ③设置控制措施 → ④制定政策 → ⑤<b>监测和快速响应</b>。</li><li><b>风险分析四步</b>：Identify 识别 → Assess 评估 → Analyze 分析（可能性 × 影响）→ Set tolerance 设定容忍度（<b>mitigate 缓解、transfer 转移、refute 反驳、accept 接受</b>）。</li><li><b>控制措施</b>：技术控制（密码、访问控制列表）和物理控制（摄像头、围栏）。清单：加密、防火墙、密码策略、网络保险、员工培训、事件响应计划、访问控制、补丁管理。</li><li><b>九个关键领域</b>：访问控制（RBAC、最小权限、MFA）、数据保护、事件响应计划、风险管理、审计与日志、政策文档、培训与意识、第三方风险、渗透测试与漏洞管理。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>必会计算</h3><p><b>风险评分 = Threat × Vulnerability × Asset Value</b>（每项 1–5，最高 125）。</p>\n<p>例：T=4，V=3，A=5 → 4×3×5 = <b>60</b>（60/125 = 48%，<b>中等风险</b>）。</p>\n<p>2025 年期末延伸：部署 IDPS，V 由 3 降到 2 → 4×2×5 = <b>40</b>；风险降低 (60−40)/60 = <b>33.3%</b>。</p>\n<p><b>密码策略合规检查</b>：逐条核对。例：策略要求≥12 位、含大写、小写、数字、符号；MyPassword123 长 13、有大小写和数字，但<b>没有符号</b> → <b>不合规</b>。</p></div><div class=\"card\" style=\"margin-top:12px\"><h3>易错点</h3><ul style=\"margin:6px 0;padding-left:20px\"><li>Awareness / Training / Education 三者别混：意识 = 知道有风险；培训 = 学会怎么做。</li><li>合规五步的第五步是<b>监测和快速响应</b>，不是“审计”。</li><li>风险公式是<b>三项相乘</b>，不是相加；降低任何一项都会降低风险。</li><li>“i4.0 起源于哪”的答案是<b>德国</b>（课件），不是美国或中国。</li></ul></div>", "3": "<div class=\"card\" style=\"margin-top:0px\"><h3>安全规划与政策（P3-2 ~ P3-11）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li><b>Cyber security plan</b>：书面文件，包含组织的安全政策、策略、流程和技术。目标：保护 CIA、管理风险、保证业务连续、满足法规。</li><li><b>计划的五个好处</b>：更好理解风险；<b>主动</b>防护；快速响应；满足合规（GDPR、PCI DSS、HIPAA）；减少内部威胁。</li><li><b>两个维度</b>：<b>Technical</b>（加密、防火墙、生物识别）和 <b>Managerial</b>（政策、操作问题、人的问题）。技术导向或政策导向的策略<b>单独都会失败</b>。</li><li><b>政策类型</b>：AUP（可接受使用）、访问控制、事件响应、数据分类、加密、密码、远程访问。治理：网络安全委员会 + <b>CISO</b>（首席信息安全官）。</li><li><b>实施政策</b>：识别风险、向他人学习、符合法律、让员工参与制定、培训、设定清晰处罚、执行、安装所需工具。</li><li><b>执行政策</b>：沟通、访问控制、监控与审计、<b>违规后果</b>（没有惩罚，员工就会心存侥幸）。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>自上而下 vs 自下而上（P3-10）</h3><table><tr><th></th><th>Top-down 自上而下</th><th>Bottom-up 自下而上</th></tr><tr><td>谁发起</td><td>高层管理者发布政策、流程</td><td>系统管理员改进自己的系统</td></tr><tr><td>优点</td><td>高层支持、专项经费、规划清晰、可影响组织文化</td><td>管理员的技术专长</td></tr><tr><td>缺点</td><td>—</td><td><b>很少奏效</b>：缺参与者支持和组织持久力</td></tr></table></div><div class=\"card\" style=\"margin-top:12px\"><h3>策略与防御层（P3-12 ~ P3-16）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li>策略目的：<b>identify, protect, detect, respond, recover</b>。</li><li><b>DLM 四层防御</b>（Digital Liability Management，“政策与技术的交汇”）：<b>Tier 1</b> 高层承诺与支持；<b>Tier 2</b> 可接受使用政策和实践声明；<b>Tier 3</b> 安全使用流程；<b>Tier 4</b> 硬件、软件、网络安全工具。</li><li><b>Zero Trust</b>：never trust, always verify。<b>Defense in depth</b>：多层叠加防御。</li><li>安全依赖 <b>Process + People + Technology</b>：政策要被制定、沟通、维护、执行；人要理解责任；系统要在技术上遵守政策。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>生物识别基础（P3-17 ~ P3-24）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li><b>三类认证因素</b>：<b>something you have</b>（令牌、智能卡）、<b>something you know</b>（PIN、密码）、<b>something you are</b>（生物特征）。</li><li><b>Identification 识别</b>：你是谁？<b>一对多</b>。<b>Verification 验证</b>：你是不是你声称的人？<b>一对一</b>。</li><li>流程：<b>Enrollment 注册</b>（存模板）→ Capture 采集 → Comparison 比对 → Decision 决策。</li><li><b>生理特征</b>（较稳定）：指纹、虹膜、视网膜、人脸、手形、DNA。<b>行为特征</b>：声音、击键、步态、签名。</li><li>优点：方便、难伪造、不会忘记、速度快、不可转让。局限：隐私、可被欺骗、<b>不可撤销</b>（密码可换，生物特征不能换）、伤病影响、成本高。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>四种生物识别对比</h3><table><tr><th></th><th>关键事实</th><th>优点</th><th>缺点</th></tr><tr><td>指纹</td><td>最广泛使用；约 30 个细节点（minutiae）；脊线终点和分叉；<b>便宜、易部署</b></td><td>低成本、快、易集成</td><td>容易被窃取/复制（无处不留）；无法重置</td></tr><tr><td>虹膜</td><td><b>最准确</b>；Daugman 1990 算法（Gabor 小波）；近红外；用 Hamming 距离比对；rubber-sheet 归一化</td><td>准确率高、非接触、稳定</td><td>不易使用、集成复杂、成本高；可被打印图像/美瞳欺骗</td></tr><tr><td>视网膜</td><td>血管图案；非常安全准确；红外光</td><td>极难伪造</td><td>需要贴近镜头、设备贵、不适合戴眼镜或白内障者</td></tr><tr><td>人脸</td><td>不如指纹准确；可远距离、非接触；PCA（Eigenfaces）、LDA、LBP、HOG、CNN、FaceNet</td><td>便利、可远距离</td><td>受光照、姿态影响；3D 人脸不受光照影响</td></tr></table></div><div class=\"card\" style=\"margin-top:12px\"><h3>必会：错误率（P3-47）</h3><ul style=\"margin:6px 0;padding-left:20px\"><li><b>FRR</b>（False Rejection Rate）= <b>Type I 错误</b>：合法用户被拒绝。</li>\n<li><b>FAR</b>（False Acceptance Rate）= <b>Type II 错误</b>：非法用户被接受。</li>\n<li><b>CER / EER</b>（crossover error rate）：FAR 与 FRR <b>相等</b>的点；越低越好。</li>\n<li><b>提高灵敏度</b> → <b>FRR 上升，FAR 下降</b>：更难让坏人进来，但也更常让合法用户失败。</li>\n<li><b>FTE</b>（Failure to Enroll）：无法注册。厂商给出的 FAR/FRR 通常在理想条件下测得，偏乐观。</li></ul></div><div class=\"card\" style=\"margin-top:12px\"><h3>生物识别如何被攻击（P3-50）</h3
